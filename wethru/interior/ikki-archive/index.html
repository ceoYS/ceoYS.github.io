<style>
:root{
  --curtain:#F3F3F2; --paper:#FBFBFA; --ink:#1E2A1E; --ink-2:#4F5B4E; --mute:#868D84; --line:rgba(30,42,30,.14);
  --moss:#46663A; --amaranth:#8A2E2A;
  --night:#131715; --forest:#1C2A1D; --forest-2:#253526; --on-dark:#EDF0E9; --on-dark-2:#A9B3A4; --line-dark:rgba(237,240,233,.16);
  --serif:"Noto Serif KR","Noto Serif CJK KR","AppleMyungjo",serif;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --gut:20px; --maxw:1240px; --head:58px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--curtain);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.7;
  word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--moss);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut)}
.serif{font-family:var(--serif)}

/* notice */
.notice{margin:0;padding:9px var(--gut);background:var(--ink);color:var(--curtain);font-size:12px;line-height:1.5;text-align:center}

/* header (1. 상단 고정 바) */
.top{position:sticky;top:0;z-index:50;height:var(--head);transition:color .35s, background-color .35s}
.top .wrap{height:100%;display:flex;align-items:center;justify-content:space-between}
.mark{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:-.01em}
.call{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:600;
  background:var(--ink);color:var(--curtain);transition:background-color .35s,color .35s}
.call svg{width:14px;height:14px}
.top.is-dark{color:var(--on-dark)}
.top.is-dark .call{background:var(--on-dark);color:var(--night)}
.top.is-solid{background:rgba(243,243,242,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.top.is-dark.is-solid{background:rgba(19,23,21,.72)}

/* 2. hero — the hanging piece assembles while you scroll */
.hang{position:relative;margin-top:calc(var(--head) * -1)}
.hang-pin{position:relative;height:100vh;height:100svh;display:grid;grid-template-rows:minmax(0,1fr) auto;
  padding:calc(var(--head) + 6px) var(--gut) calc(22px + env(safe-area-inset-bottom));overflow:hidden}
.stage-wrap{position:relative;display:grid;place-items:center;min-height:0}
/* sized by width only, so the photo and the four layers always share one coordinate box */
.stage{position:relative;width:min(100%, calc((100vh - 280px) * .778));width:min(100%, calc((100svh - 280px) * .778));aspect-ratio:730/938}
.stage .ghost{position:absolute;inset:0;width:100%;height:100%;filter:grayscale(1) contrast(.9);opacity:0;pointer-events:none}
.hang.anim .stage .ghost{opacity:.1}
.stage .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  -webkit-mask-image:radial-gradient(ellipse 62% 58% at 50% 50%,#000 62%,transparent 100%);
          mask-image:radial-gradient(ellipse 62% 58% at 50% 50%,#000 62%,transparent 100%)}
.stage .layer{position:absolute;height:auto;transform-origin:50% 0;will-change:transform}
.stage .layer.strands{--rv:130%;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(var(--rv) - 30%),transparent var(--rv));
          mask-image:linear-gradient(to bottom,#000 calc(var(--rv) - 30%),transparent var(--rv))}
.wire{position:absolute;width:1px;background:var(--ink);transform-origin:50% 0;opacity:.55;display:none}
.hang.anim .wire{display:block}
.stage-cap{position:absolute;right:0;bottom:-2px;font-size:12px;color:var(--mute)}
.hang-copy{position:relative;min-height:154px}
.hang-copy > *{position:absolute;left:0;right:0;bottom:0;margin:0}
.cue,.step{opacity:0}
.cue{font-family:var(--serif);font-weight:300;font-size:20px;line-height:1.5}
.cue i{display:block;width:1px;height:34px;margin:0 0 14px;background:var(--ink);transform-origin:50% 0;animation:drip 2.4s cubic-bezier(.6,0,.3,1) infinite;font-style:normal}
@keyframes drip{0%{transform:scaleY(0);opacity:1}55%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.step{display:grid;gap:6px}
.step small{font-size:12px;font-variant-numeric:tabular-nums;color:var(--mute)}
.step span{font-family:var(--serif);font-weight:300;font-size:22px;line-height:1.45}
.final h1{margin:0 0 12px;font-family:var(--serif);font-weight:300;font-size:clamp(34px,9.4vw,64px);line-height:1.18;letter-spacing:-.02em}
.final h1 span{display:block}
.final p{margin:0 0 20px;font-size:15px;line-height:1.65;color:var(--ink-2);max-width:26em}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;
  font-size:15px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:background-color .2s,color .2s,border-color .2s}
.btn svg{width:16px;height:16px}
.btn-ink{background:var(--ink);color:var(--curtain)}
.btn-ink:hover{background:#2C3B2C}
.btn-text{display:inline-flex;align-items:center;min-height:50px;padding:0 8px;font-size:15px;font-weight:600;
  text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
.btn-light{background:var(--on-dark);color:var(--forest)}
.btn-ghost{border-color:var(--line-dark);color:var(--on-dark)}
.btn-ghost:hover{border-color:var(--on-dark)}
/* static fallback (no JS / reduced motion): finished piece + final copy */
.final{opacity:1}
.hang.anim .final{opacity:0}
.hang.anim .cue{opacity:1}

/* intro */
.intro{padding:72px 0 96px}
.statement{margin:0;font-family:var(--serif);font-weight:300;font-size:21px;line-height:1.7;letter-spacing:-.01em;max-width:30em}
.facts{display:grid;gap:18px;margin:48px 0 0;padding:0}
.facts div{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px}
.facts dt{font-size:13px;color:var(--mute);padding-top:2px}
.facts dd{margin:0;font-size:15px;line-height:1.65;white-space:pre-line}

/* night chapter */
.night{background:var(--night);color:var(--on-dark);padding:0 0 88px;overflow:hidden}
.night-fig{margin:0;overflow:hidden;transform-origin:50% 0}
.night-fig img{width:100%;height:auto}
.night-cap{padding-top:34px}
.night-cap .place{margin:0 0 22px;font-size:13px;color:var(--on-dark-2)}
.night-cap .place b{color:var(--on-dark);font-weight:600;margin-right:10px}
.night-quote{margin:0;font-family:var(--serif);font-weight:300;font-size:24px;line-height:1.6;letter-spacing:-.01em}
.night-quote span{display:block}
.night-credits{margin:28px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.9;color:var(--on-dark-2);white-space:pre}

/* 3. works */
.works{padding:96px 0 40px}
.sec-head{margin-bottom:44px}
.sec-head h2{margin:0 0 10px;font-family:var(--serif);font-weight:300;font-size:28px;line-height:1.3;letter-spacing:-.01em}
.sec-head p{margin:0;font-size:15px;color:var(--ink-2);max-width:28em}
.work{margin:0 0 64px}
.work .ph{position:relative;display:block;width:100%;padding:0;border:0;background:#E6E7E3;overflow:hidden;cursor:zoom-in}
.work .ph img{width:100%;height:auto;opacity:0;transition:opacity .8s ease}
.work .ph img.is-loaded{opacity:1}
.work .ph.is-missing img{visibility:hidden}
.work .ph.is-missing::after{content:attr(data-label);position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--mute)}
.work figcaption{display:flex;justify-content:space-between;gap:14px;padding-top:12px}
.work figcaption .t{font-family:var(--serif);font-weight:400;font-size:16px;line-height:1.45}
.work figcaption .n{display:block;font-family:var(--sans);font-size:13px;color:var(--mute);margin-top:2px}
.work figcaption .y{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:3px}
.v-l{width:86%}
.v-r{width:70%;margin-left:auto}
.v-full{margin-left:calc(var(--gut) * -1);margin-right:calc(var(--gut) * -1)}
.v-full figcaption{padding-left:var(--gut);padding-right:var(--gut)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;margin:0 0 64px}
.pair .work{margin:0}
.pair .work:nth-child(2){margin-top:56px}
.pair .work figcaption{display:block}
.pair .work figcaption .y{display:block;padding-top:0}

/* 4. reviews / credits */
.clients{padding:72px 0 40px}
.review-list,.credit-list{margin:0;padding:0;list-style:none}
.review-list li{padding:22px 0;border-top:1px solid var(--line)}
.review-list blockquote{margin:0;font-family:var(--serif);font-size:18px;line-height:1.7}
.review-list footer{margin-top:8px;font-size:13px;color:var(--mute)}
.credit-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.credit-list li:last-child{border-bottom:1px solid var(--line)}
.credit-list .c{grid-column:1;grid-row:1;font-family:var(--serif);font-size:18px;line-height:1.45}
.credit-list .y{grid-column:2;grid-row:1;font-size:12.5px;line-height:2.1;color:var(--mute);font-variant-numeric:tabular-nums}
.credit-list .p{grid-column:1 / -1;grid-row:2;font-size:13.5px;color:var(--ink-2)}

/* 5. services */
.services{padding:72px 0 112px}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:26px 18px;margin:0;padding:0;list-style:none}
.svc h3{margin:0 0 4px;font-family:var(--serif);font-weight:400;font-size:16.5px;line-height:1.45}
.svc p{margin:0;font-size:13px;line-height:1.6;color:var(--ink-2)}
.process{margin-top:80px}
.process h3.sub{margin:0 0 26px;font-family:var(--serif);font-weight:300;font-size:22px}
.steps{display:grid;gap:26px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:12px}
.steps .num{font-family:var(--serif);font-weight:300;font-size:26px;line-height:1.05;color:var(--moss)}
.steps h4{margin:0 0 3px;font-size:16px;font-weight:600}
.steps p{margin:0;font-size:14px;line-height:1.65;color:var(--ink-2)}

/* 6. contact */
.contact{background:var(--forest);color:var(--on-dark);padding:96px 0 0}
.contact h2{margin:0 0 10px;font-family:var(--serif);font-weight:300;font-size:30px;line-height:1.3}
.contact .lead{margin:0 0 34px;color:var(--on-dark-2)}
.bigtel{display:inline-block;font-family:var(--serif);font-weight:300;font-size:clamp(34px,10.5vw,72px);line-height:1.1;letter-spacing:-.01em;
  border-bottom:1px solid var(--line-dark);padding-bottom:6px}
.bigtel:hover{border-color:var(--on-dark)}
.contact .alt{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 0}
.form{margin-top:56px;padding:24px 20px 26px;background:var(--forest-2);border-radius:18px}
.form h3{margin:0 0 18px;font-family:var(--serif);font-weight:400;font-size:19px}
.field{margin:0 0 16px;padding:0;border:0;min-width:0}
.field > label,.field legend{display:block;margin:0 0 7px;padding:0;font-size:13.5px;color:var(--on-dark)}
.field input[type=text],.field input[type=tel],.field textarea{width:100%;font:inherit;font-size:16px;line-height:1.5;color:var(--ink);
  background:var(--paper);border:1px solid transparent;border-radius:12px;padding:12px 14px}
.field textarea{min-height:108px;resize:vertical}
.field input:focus-visible,.field textarea:focus-visible{outline:2px solid #C9D3BC;outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:inline-flex;align-items:center;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line-dark);font-size:14px;cursor:pointer}
.chips input:checked + span{background:var(--on-dark);border-color:var(--on-dark);color:var(--forest)}
.chips input:focus-visible + span{outline:2px solid #C9D3BC;outline-offset:2px}
.consent{display:flex;gap:10px;align-items:flex-start;margin:4px 0 20px;font-size:13px;line-height:1.6;color:var(--on-dark-2);cursor:pointer}
.consent input{width:18px;height:18px;margin:2px 0 0;accent-color:#C9D3BC;flex:none}
.form .btn{width:100%}
.form-msg{min-height:1.6em;margin:12px 0 0;font-size:14px;color:#F0D9A8}
.foot{padding:72px 0 calc(110px + env(safe-area-inset-bottom));font-size:13px;line-height:1.85;color:var(--on-dark-2)}
.foot .mark{display:inline-block;margin-bottom:10px;color:var(--on-dark)}
.foot p{margin:0}
.foot .note{margin-top:22px;padding-top:16px;border-top:1px solid var(--line-dark);font-size:12px}

/* mobile dock */
.dock{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:45;display:grid;grid-template-columns:1.4fr 1fr;gap:8px;
  padding:6px;border-radius:999px;background:rgba(30,42,30,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 10px 30px rgba(19,23,21,.22);transform:translateY(140%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.dock.is-on{transform:none}
.dock a{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;border-radius:999px;font-size:14.5px;font-weight:600}
.dock .d1{background:var(--on-dark);color:var(--forest)}
.dock .d2{color:var(--on-dark)}
.dock svg{width:15px;height:15px}

/* toast + lightbox */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;width:min(92vw,440px);padding:14px 18px;border-radius:14px;
  background:var(--ink);color:var(--curtain);font-size:14px;line-height:1.6;box-shadow:0 10px 30px rgba(19,23,21,.25);
  opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:opacity .3s,transform .3s}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
.lb{width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#111411;color:var(--on-dark)}
.lb::backdrop{background:transparent}
.lb-inner{display:grid;grid-template-rows:minmax(0,1fr) auto;height:100%;padding:58px 14px calc(18px + env(safe-area-inset-bottom))}
.lb-stage{display:grid;place-items:center;min-height:0}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain}
.lb-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px}
.lb-cap{margin:0}
.lb-cap .t{display:block;font-family:var(--serif);font-size:16px}
.lb-cap .n{display:block;font-size:13px;color:var(--on-dark-2)}
.lb-nav{display:flex;gap:8px}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:999px;border:1px solid var(--line-dark);background:transparent;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.lb-close{position:absolute;top:8px;right:10px;border:0}

@media (prefers-reduced-motion: reduce){ .cue i{animation:none} .work .ph img{transition:none} .dock{transition:none} }

/* tablet and up */
@media (min-width:720px){
  :root{--gut:36px}
  .statement{font-size:27px}
  .facts{grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
  .facts div{grid-template-columns:1fr;gap:6px}
  .svc{grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 28px}
  .steps{grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
  .steps li{grid-template-columns:1fr;row-gap:10px}
  .form{padding:32px}
}
@media (min-width:960px){
  :root{--gut:48px;--head:68px}
  .mark{font-size:21px}
  .hang-pin{grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-rows:1fr;column-gap:48px;padding:calc(var(--head) + 20px) var(--gut) 40px;max-width:var(--maxw);margin:0 auto}
  .hang-copy{grid-column:1;grid-row:1;min-height:0;align-self:end;height:260px}
  .stage-wrap{grid-column:2;grid-row:1}
  .stage{width:min(100%, calc((100vh - 150px) * .778), 600px);width:min(100%, calc((100svh - 150px) * .778), 600px)}
  .cue{font-size:26px}
  .step span{font-size:30px}
  .final p{font-size:16.5px}
  .intro{padding:140px 0 150px}
  .statement{font-size:34px;max-width:24em}
  .night{padding-bottom:140px}
  .night-inner{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);column-gap:64px;align-items:end;max-width:var(--maxw);margin:0 auto;padding:0 var(--gut)}
  .night-fig{border-radius:0}
  .night-cap{padding:0 0 12px}
  .night-quote{font-size:32px}
  .works{padding-top:150px}
  .sec-head h2{font-size:42px}
  .works-list{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:28px;align-items:start}
  .work{margin-bottom:110px}
  .v-l{grid-column:1 / 8;width:auto}
  .v-r{grid-column:7 / 12;width:auto;margin-top:160px}
  .v-full{grid-column:3 / 12;margin:0 0 110px}
  .v-full figcaption{padding:12px 0 0}
  .pair{grid-column:1 / 13;grid-template-columns:repeat(12,minmax(0,1fr));gap:28px;margin-bottom:110px}
  .pair .work:nth-child(1){grid-column:2 / 7}
  .pair .work:nth-child(2){grid-column:8 / 12;margin-top:180px}
  .clients{padding-top:120px}
  .credit-list li{grid-template-columns:300px minmax(0,1fr) auto;align-items:baseline}
  .credit-list .p{grid-column:2;grid-row:1;font-size:15px}
  .credit-list .y{grid-column:3}
  .services{padding:120px 0 160px}
  .contact{padding-top:140px}
  .contact-grid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);column-gap:72px;align-items:start}
  .contact-grid .form{margin-top:0}
  .dock{display:none}
  .toast{bottom:28px}
}
</style>
</head>
<body>
<p class="notice" id="notice" hidden></p>

<header class="top" id="top">
  <div class="wrap">
    <a class="mark" id="mark" href="#hang"></a>
    <a class="call" id="call" href="#"><span data-i="phone"></span><span>전화 문의</span></a>
  </div>
</header>

<main>
  <!-- 2. 히어로: 스크롤 조립 -->
  <section class="hang" id="hang" aria-label="소개">
    <div class="hang-pin" id="hang-pin">
      <div class="stage-wrap">
        <div class="stage" id="stage">
          <img class="photo" id="hang-photo" alt="" fetchpriority="high">
          <img class="ghost" id="hang-ghost" alt="" aria-hidden="true">
          <span class="wire" id="wire"></span>
          <span class="stage-cap" id="stage-cap"></span>
        </div>
      </div>
      <div class="hang-copy" id="hang-copy">
        <p class="cue" id="cue"><i></i><span></span></p>
        <div class="final" id="final">
          <h1 id="hero-title"></h1>
          <p id="hero-sub"></p>
          <div class="cta-row" id="hero-cta"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="intro">
    <div class="wrap">
      <p class="statement" id="statement"></p>
      <dl class="facts" id="facts"></dl>
    </div>
  </section>

  <section class="night" data-theme="dark" aria-labelledby="night-place">
    <div class="night-inner">
      <figure class="night-fig" id="night-fig"><img id="night-img" loading="lazy" decoding="async"></figure>
      <div class="night-cap wrap">
        <p class="place" id="night-place"></p>
        <p class="night-quote" id="night-quote"></p>
        <p class="night-credits" id="night-credits"></p>
      </div>
    </div>
  </section>

  <!-- 3. 작업 사진 -->
  <section class="works" id="works" aria-labelledby="works-title">
    <div class="wrap">
      <header class="sec-head">
        <h2 id="works-title">작업 기록</h2>
        <p id="works-intro"></p>
      </header>
      <div class="works-list" id="works-list"></div>
    </div>
  </section>

  <!-- 4. 후기(원문만) / 함께 작업한 곳 -->
  <section class="clients" id="reviews" aria-labelledby="reviews-title" hidden>
    <div class="wrap">
      <header class="sec-head"><h2 id="reviews-title">맡겨 주신 분들의 이야기</h2></header>
      <ul class="review-list" id="review-list"></ul>
    </div>
  </section>
  <section class="clients" id="clients" aria-labelledby="clients-title">
    <div class="wrap">
      <header class="sec-head">
        <h2 id="clients-title">함께 작업한 곳</h2>
        <p>인테리어 회사와 카페, 전시 부스의 의뢰로 작업했습니다.</p>
      </header>
      <ul class="credit-list" id="credit-list"></ul>
    </div>
  </section>

  <!-- 5. 시공 범위 -->
  <section class="services" aria-labelledby="svc-title">
    <div class="wrap">
      <header class="sec-head"><h2 id="svc-title">이런 공간을 만듭니다</h2></header>
      <ul class="svc" id="svc"></ul>
      <div class="process">
        <h3 class="sub">진행 순서</h3>
        <ol class="steps" id="steps"></ol>
      </div>
    </div>
  </section>

  <!-- 6. 문의 + 7. 푸터 -->
  <section class="contact" id="contact" data-theme="dark" aria-labelledby="contact-title">
    <div class="wrap contact-grid">
      <div>
        <h2 id="contact-title">어떤 공간인지 알려주세요</h2>
        <p class="lead">작은 공간도 괜찮습니다. 편한 방법으로 연락 주세요.</p>
        <a class="bigtel" id="bigtel" href="#"></a>
        <div class="alt" id="contact-alt"></div>
      </div>
      <form class="form" id="form" novalidate>
        <h3>문의 남기기</h3>
        <div class="field"><label for="f-name">이름</label><input type="text" id="f-name" autocomplete="name"></div>
        <div class="field"><label for="f-phone">연락처</label><input type="tel" id="f-phone" autocomplete="tel" inputmode="tel" placeholder="010-0000-0000"></div>
        <fieldset class="field"><legend>공간 종류</legend><div class="chips" id="chips"></div></fieldset>
        <div class="field"><label for="f-size">공간 크기 (평수)</label><input type="text" id="f-size" placeholder="예: 카페 40평, 거실 한쪽 벽"></div>
        <div class="field"><label for="f-body">내용</label><textarea id="f-body" placeholder="원하는 분위기, 일정, 예산 등을 편하게 적어주세요."></textarea></div>
        <label class="consent"><input type="checkbox" id="f-consent"><span>문의에 답하기 위해 이름과 연락처를 수집하는 데 동의합니다.</span></label>
        <button type="submit" class="btn btn-light">문의 남기기</button>
        <p class="form-msg" id="form-msg" role="alert"></p>
      </form>
    </div>
    <footer class="foot"><div class="wrap" id="foot"></div></footer>
  </section>
</main>

<nav class="dock" id="dock" aria-label="빠른 문의">
  <a class="d1" id="dock-call" href="#"><span data-i="phone"></span><span>전화 상담</span></a>
  <a class="d2" id="dock-dm" href="#" target="_blank" rel="noopener"><span data-i="ig"></span><span>DM</span></a>
</nav>

<dialog class="lb" id="lb" aria-label="사진 크게 보기">
  <div class="lb-inner">
    <div class="lb-stage"><img id="lb-img" alt=""></div>
    <div class="lb-foot">
      <p class="lb-cap" id="lb-cap"></p>
      <div class="lb-nav">
        <button type="button" class="icon-btn" id="lb-prev" aria-label="이전 사진"><span data-i="prev"></span></button>
        <button type="button" class="icon-btn" id="lb-next" aria-label="다음 사진"><span data-i="next"></span></button>
      </div>
    </div>
  </div>
  <button type="button" class="icon-btn lb-close" id="lb-close" aria-label="닫기"><span data-i="close"></span></button>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const C = CONFIG, $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const I = {
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h3.2l1.6 4-2 1.3a10.5 10.5 0 0 0 6.9 6.9l1.3-2 4 1.6V19a1.6 1.6 0 0 1-1.7 1.6A15.6 15.6 0 0 1 3.4 5.7 1.6 1.6 0 0 1 5 4z"/></svg>',
    ig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/></svg>',
    prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>',
    next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>'
  };
  const tel = 'tel:' + C.phone.replace(/[^\d+]/g, '');
  const dm = C.instagram ? 'https://ig.me/m/' + C.instagram : '';
  const ig = C.instagram ? 'https://www.instagram.com/' + C.instagram + '/' : '';
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* images: fade in on load, quiet placeholder if a file is missing */
  function setImg(img, p, eager) {
    const frame = img.closest('.ph');
    img.alt = p.alt || ''; img.width = p.w; img.height = p.h; img.decoding = 'async';
    if (!eager) img.loading = 'lazy';
    if (frame) frame.dataset.label = p.title || '';
    img.addEventListener('load', () => img.classList.add('is-loaded'));
    img.addEventListener('error', () => { if (frame) frame.classList.add('is-missing'); });
    img.src = p.src;
    if (img.complete && img.naturalWidth) img.classList.add('is-loaded');
  }

  /* notice, header, dock */
  if (C.previewNotice) { const n = $('#notice'); n.textContent = C.previewNotice; n.hidden = false; }
  $('#mark').textContent = C.bizName;
  $('#call').href = tel; $('#dock-call').href = tel;
  if (dm) $('#dock-dm').href = dm; else $('#dock-dm').hidden = true;

  /* hero */
  const H = C.hang, stage = $('#stage');
  $('#hang-photo').src = H.photo;
  $('#hang-ghost').src = H.ghost;
  $('#stage-cap').textContent = H.caption || '';
  const wire = $('#wire');
  wire.style.left = H.tip.x + '%'; wire.style.bottom = (100 - H.tip.y) + '%'; wire.style.height = '120vh';
  const layers = H.layers.map((L, i) => {
    const im = document.createElement('img');
    im.className = 'layer ' + L.key; im.alt = ''; im.decoding = 'async'; im.src = L.src;
    im.style.left = L.x + '%'; im.style.top = L.y + '%'; im.style.width = L.w + '%'; im.style.zIndex = 2 + i;
    stage.appendChild(im); return im;
  });
  wire.style.zIndex = 1;
  $('#hero-title').innerHTML = H.headline.map((l) => '<span>' + esc(l) + '</span>').join('');
  $('#hero-sub').textContent = H.sub;
  $('#hero-cta').innerHTML = '<a class="btn btn-ink" href="' + tel + '">' + I.phone + '<span>전화로 상담하기</span></a><a class="btn-text" href="#works">작업 보기</a>';
  $('#cue span').textContent = H.cue;
  const copy = $('#hang-copy');
  const steps = H.steps.map((s, i) => {
    const el = document.createElement('p'); el.className = 'step';
    el.innerHTML = '<small>' + (i + 1) + ' / ' + H.steps.length + '</small><span>' + esc(s) + '</span>';
    copy.insertBefore(el, $('#final')); return el;
  });

  /* intro */
  $('#statement').textContent = C.statement;
  $('#facts').innerHTML = C.facts.map((f) => '<div><dt>' + esc(f.k) + '</dt><dd>' + esc(f.v) + '</dd></div>').join('');

  /* night chapter */
  const ch = C.chapter, nimg = $('#night-img');
  nimg.src = ch.src; nimg.alt = ch.alt; nimg.width = ch.w; nimg.height = ch.h;
  $('#night-place').innerHTML = '<b>' + esc(ch.place) + '</b>' + esc(ch.date);
  $('#night-quote').innerHTML = ch.quote.map((l) => '<span>' + esc(l) + '</span>').join('');
  $('#night-credits').textContent = ch.credits.join('\n');

  /* works */
  $('#works-intro').textContent = C.worksIntro;
  const list = $('#works-list'); let pairBox = null;
  C.works.forEach((p, i) => {
    const fig = document.createElement('figure');
    fig.className = 'work' + (p.v === 'pair' ? '' : ' v-' + p.v);
    fig.innerHTML = '<button type="button" class="ph" aria-label="' + esc(p.title) + ' 사진 크게 보기"><img></button>' +
      '<figcaption><span class="t">' + esc(p.title) + '<span class="n">' + esc(p.note) + '</span></span><span class="y">' + esc(p.year) + '</span></figcaption>';
    if (p.v === 'pair') {
      if (!pairBox || pairBox.children.length === 2) { pairBox = document.createElement('div'); pairBox.className = 'pair'; list.appendChild(pairBox); }
      pairBox.appendChild(fig);
    } else { pairBox = null; list.appendChild(fig); }
    setImg(fig.querySelector('img'), p, false);
    fig.querySelector('button').addEventListener('click', () => openLB(i));
  });

  /* reviews (verbatim only) / credits */
  if (C.reviews && C.reviews.length) {
    $('#review-list').innerHTML = C.reviews.map((r) => '<li><blockquote>' + esc(r.body) + '</blockquote><footer>' + esc([r.author, r.date].filter(Boolean).join(', ')) + '</footer></li>').join('');
    $('#reviews').hidden = false;
  }
  if (C.credits && C.credits.length) {
    $('#credit-list').innerHTML = C.credits.map((c) => '<li><span class="c">' + esc(c.client) + '</span><span class="p">' + esc(c.project) + '</span><span class="y">' + esc(c.year) + '</span></li>').join('');
  } else $('#clients').hidden = true;

  /* services + process */
  $('#svc').innerHTML = C.services.map((s) => '<li><h3>' + esc(s.name) + '</h3><p>' + esc(s.desc) + '</p></li>').join('');
  $('#steps').innerHTML = C.process.map((s, i) => '<li><span class="num" aria-hidden="true">' + (i + 1) + '</span><div><h4>' + esc(s.name) + '</h4><p>' + esc(s.desc) + '</p></div></li>').join('');

  /* contact */
  const big = $('#bigtel'); big.href = tel; big.textContent = C.phone.replace(/-/g, ' ');
  const alt = [];
  if (dm) alt.push('<a class="btn btn-ghost" href="' + dm + '" target="_blank" rel="noopener">' + I.ig + '<span>인스타그램 DM 보내기</span></a>');
  if (C.kakaoUrl) alt.push('<a class="btn btn-ghost" href="' + esc(C.kakaoUrl) + '" target="_blank" rel="noopener"><span>카카오톡으로 문의하기</span></a>');
  $('#contact-alt').innerHTML = alt.join('');
  $('#chips').innerHTML = C.spaceTypes.map((t) => '<label><input type="radio" name="space" value="' + esc(t) + '"><span>' + esc(t) + '</span></label>').join('');
  const form = $('#form'), msg = $('#form-msg');
  form.addEventListener('submit', (e) => {
    e.preventDefault(); let err = '';
    if (!$('#f-name').value.trim()) err = '이름을 입력해 주세요.';
    else if (!/\d{2,}/.test($('#f-phone').value)) err = '연락처를 입력해 주세요.';
    else if (!$('#f-consent').checked) err = '개인정보 수집에 동의해 주세요.';
    msg.textContent = err; if (err) return;
    toast('시안 화면이라 실제로 전송되지는 않습니다. 정식 오픈 후에는 이 문의가 사장님 휴대폰 문자로 바로 갑니다.');
    form.reset();
  });
  const lines = ['<a class="mark" href="#hang">' + esc(C.bizName) + '</a>', '<p>실내조경, 플랜테리어, 이끼정원, 행잉 작품</p>',
    '<p>전화 <a href="' + tel + '">' + esc(C.phone) + '</a></p>'];
  if (ig) lines.push('<p>인스타그램 <a href="' + ig + '" target="_blank" rel="noopener">@' + esc(C.instagram) + '</a></p>');
  if (C.area) lines.push('<p>작업 지역 ' + esc(C.area) + '</p>');
  if (C.bizInfo && (C.bizInfo.owner || C.bizInfo.regNo)) lines.push('<p>' + esc([C.bizInfo.owner && '대표 ' + C.bizInfo.owner, C.bizInfo.regNo && '사업자등록번호 ' + C.bizInfo.regNo].filter(Boolean).join(', ')) + '</p>');
  lines.push('<p class="note">이 페이지는 ' + esc(C.bizName) + '에 보여드리기 위해 만든 시안입니다.</p>');
  $('#foot').innerHTML = lines.join('');

  /* toast */
  const toastEl = $('#toast'); let tt;
  function toast(t) { toastEl.textContent = t; toastEl.classList.add('is-on'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('is-on'), 5200); }

  /* lightbox */
  const lb = $('#lb'), lbImg = $('#lb-img'), lbCap = $('#lb-cap'); let cur = 0;
  const thumbs = () => list.querySelectorAll('.ph img');
  function show() { const p = C.works[cur], t = thumbs()[cur]; lbImg.src = t.currentSrc || t.src; lbImg.alt = p.alt || '';
    lbCap.innerHTML = '<span class="t">' + esc(p.title) + '</span><span class="n">' + esc(p.note + ', ' + p.year) + '</span>'; }
  function openLB(i) { cur = i; show(); if (lb.showModal) lb.showModal(); else lb.setAttribute('open', ''); }
  const stepLB = (d) => { cur = (cur + d + C.works.length) % C.works.length; show(); };
  $('#lb-prev').addEventListener('click', () => stepLB(-1));
  $('#lb-next').addEventListener('click', () => stepLB(1));
  $('#lb-close').addEventListener('click', () => lb.close());
  lb.addEventListener('click', (e) => { if (e.target === lb || e.target.classList.contains('lb-stage')) lb.close(); });
  lb.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') stepLB(-1); if (e.key === 'ArrowRight') stepLB(1); });
  let sx = null;
  lb.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', (e) => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) stepLB(dx < 0 ? 1 : -1); sx = null; });

  document.querySelectorAll('[data-i]').forEach((n) => { n.outerHTML = I[n.dataset.i] || ''; });

  /* header theme + solid state, dock visibility */
  const top = $('#top'), dock = $('#dock'), hang = $('#hang'), contact = $('#contact');
  const darks = Array.from(document.querySelectorAll('[data-theme="dark"]'));
  let pinEnd = 0;   /* end of the pinned hero; 0 when the assembly is not running */
  function onScroll() {
    const y = window.scrollY, probe = top.offsetHeight / 2, vh = window.innerHeight;
    top.classList.toggle('is-dark', darks.some((s) => { const r = s.getBoundingClientRect(); return r.top <= probe && r.bottom >= probe; }));
    top.classList.toggle('is-solid', y > pinEnd + 2);
    const cr = contact.getBoundingClientRect();
    dock.classList.toggle('is-on', y > pinEnd + vh * 0.35 && cr.top > vh * 0.75);
  }
  window.addEventListener('scroll', onScroll, { passive: true }); window.addEventListener('resize', onScroll); onScroll();

  /* the assembly: needs GSAP; without it (or with reduced motion) the finished piece shows as is */
  function startMotion() {
    if (reduce || !window.gsap || !window.ScrollTrigger) return;
    gsap.registerPlugin(ScrollTrigger);
    ScrollTrigger.config({ ignoreMobileResize: true });
    hang.classList.add('anim');
    const [cone, middle, ring, strands] = layers, cue = $('#cue'), fin = $('#final'), photo = $('#hang-photo'), cap = $('#stage-cap');
    const drop = (k) => () => -window.innerHeight * k;
    gsap.set(photo, { opacity: 0 }); gsap.set(cap, { opacity: 0 }); gsap.set(fin, { y: 24 });
    const tl = gsap.timeline({
      defaults: { ease: 'none' },
      scrollTrigger: { trigger: hang, start: 'top top', end: () => '+=' + Math.round(window.innerHeight * 2.3), pin: '#hang-pin',
        scrub: 0.7, anticipatePin: 1, invalidateOnRefresh: true }
    });
    tl.to(cue, { opacity: 0, duration: 0.05 }, 0.01)
      .fromTo(wire, { scaleY: 0 }, { scaleY: 1, duration: 0.12, ease: 'power1.inOut' }, 0)
      .fromTo(cone, { y: drop(0.62), rotate: -7, opacity: 0 }, { y: 0, rotate: 0, opacity: 1, duration: 0.2, ease: 'power2.out' }, 0.09)
      .fromTo(middle, { y: drop(0.8), rotate: 6, opacity: 0 }, { y: 0, rotate: 0, opacity: 1, duration: 0.2, ease: 'power2.out' }, 0.29)
      .fromTo(ring, { y: drop(0.95), rotate: -4, opacity: 0 }, { y: 0, rotate: 0, opacity: 1, duration: 0.2, ease: 'power2.out' }, 0.49)
      .fromTo(strands, { '--rv': '0%', y: -10 }, { '--rv': '130%', y: 0, duration: 0.16, ease: 'power1.out' }, 0.69)
      .to('#hang-ghost', { opacity: 0, duration: 0.1 }, 0.82)
      .to(photo, { opacity: 1, duration: 0.12 }, 0.85)
      .to(wire, { opacity: 0, duration: 0.08 }, 0.86)
      .to(cap, { opacity: 1, duration: 0.08 }, 0.9)
      .to(fin, { opacity: 1, y: 0, duration: 0.1, ease: 'power2.out' }, 0.88)
      .to({}, { duration: 0.04 });
    const win = [[0.06, 0.27], [0.27, 0.47], [0.47, 0.67], [0.67, 0.86]];
    steps.forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.04 }, win[i][0])
        .to(el, { opacity: 0, y: -10, duration: 0.04 }, win[i][1] - 0.04);
    });
    /* night chapter opens up as it enters */
    gsap.fromTo('#night-fig', { scale: 0.88, borderRadius: 18 }, { scale: 1, borderRadius: 0, ease: 'none',
      scrollTrigger: { trigger: '.night', start: 'top 92%', end: 'top 20%', scrub: 0.5 } });
    const syncPin = () => { pinEnd = tl.scrollTrigger ? tl.scrollTrigger.end : 0; onScroll(); };
    ScrollTrigger.addEventListener('refresh', syncPin); syncPin();
  }
  if (window.gsap && window.ScrollTrigger) startMotion();
  else window.addEventListener('load', startMotion);
});
</script>

</body>
</html>
