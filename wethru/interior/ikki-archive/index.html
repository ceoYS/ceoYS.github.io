<style>
:root{
  --canvas:#A4A160; --canvas-ink:#3A3A16; --rim:#8B8850;
  --stage:#141A0C; --stage-2:#1C2512; --glow:rgba(118,138,72,.5);
  --cream:#E9E6D4; --cream-2:#DEDAC3; --paper:#F4F2E6; --ink:#141A0C; --ink-2:#4A4C33; --mute:#76764F;
  --on-stage:#EEEBDB; --on-stage-2:rgba(238,235,219,.66); --line-stage:rgba(238,235,219,.16);

}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.65;

:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none}

/* ---------- shared pieces ---------- */
.panel{position:relative;margin:0 var(--m);border-radius:var(--r);border:var(--rim-w) solid var(--rim);overflow:hidden}
.panel.dark{background:var(--stage);color:var(--on-stage)}
.panel.light{background:var(--paper);border-color:var(--cream-2)}
.grain::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;

.kr{font-family:var(--kr);font-weight:800;letter-spacing:-.045em;line-height:1.04}
.pill{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;font-weight:600;font-size:14.5px;white-space:nowrap}
.pill-cream{background:var(--cream);color:var(--ink)}
.pill-dark{background:var(--ink);color:var(--cream)}
.pill-line{box-shadow:inset 0 0 0 1px var(--line-stage);color:var(--on-stage)}

.meta{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;height:40px;padding:0 calc(var(--m) + 8px);
  font-size:12px;font-weight:500;color:var(--canvas-ink)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta .plus{width:14px;height:14px;position:relative;flex:none}
.meta .plus::before,.meta .plus::after{content:"";position:absolute;left:50%;top:50%;background:var(--canvas-ink);transform:translate(-50%,-50%)}
.meta .plus::before{width:14px;height:1.2px}.meta .plus::after{width:1.2px;height:14px}

/* ---------- 2. hero stage ---------- */
.hero{height:100vh;height:100svh;display:flex;flex-direction:column;padding-bottom:var(--m)}
.stage{flex:1;min-height:0;
  background:radial-gradient(120% 70% at 50% 18%,#33431F 0%,#1D2612 46%,#12180A 100%)}
.stage .glow{position:absolute;left:50%;top:44%;width:120%;aspect-ratio:1;transform:translate(-50%,-50%);

.stage .floor{position:absolute;left:50%;bottom:-8%;width:130%;height:34%;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(6,8,3,.75),transparent);pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 14px 0 18px}
.logo{font-family:var(--en);font-size:26px;line-height:1;letter-spacing:-.02em;color:var(--on-stage)}
.seg{display:flex;gap:2px;padding:4px;border-radius:14px;background:rgba(233,230,212,.13);

.seg a{display:grid;place-items:center;width:36px;height:34px;border-radius:10px;color:var(--on-stage)}
.seg a:hover{background:rgba(233,230,212,.12)}
.seg a.on{background:var(--cream);color:var(--ink)}
.seg svg.i{width:16px;height:16px}
.sq{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:rgba(233,230,212,.13);color:var(--on-stage)}
.scene{position:absolute;inset:0}
.wire{position:absolute;width:1px;background:linear-gradient(rgba(238,235,219,.15),rgba(238,235,219,.55));transform-origin:50% 0;z-index:3}
.piece{position:absolute;z-index:4}
.piece .ghost{position:absolute;inset:0;width:100%;height:100%;opacity:0;filter:grayscale(1) brightness(2.4);pointer-events:none}
.piece .layer{position:absolute;height:auto;transform-origin:50% 0;will-change:transform;filter:drop-shadow(0 18px 24px rgba(0,0,0,.35))}
.piece .layer.strands{--rv:130%;-webkit-mask-image:linear-gradient(#000 calc(var(--rv) - 30%),transparent var(--rv));mask-image:linear-gradient(#000 calc(var(--rv) - 30%),transparent var(--rv))}
.card{position:absolute;z-index:2;width:var(--cs);height:var(--cs);margin:calc(var(--cs) / -2) 0 0 calc(var(--cs) / -2);
  border-radius:calc(var(--cs) * .27);background:var(--cream);padding:calc(var(--cs) * .1);
  box-shadow:0 18px 40px rgba(0,0,0,.28);will-change:transform}
.card img{width:100%;height:100%;object-fit:cover;border-radius:calc(var(--cs) * .19)}
.card span{position:absolute;left:50%;bottom:calc(var(--cs) * -.02);transform:translate(-50%,50%);padding:2px 9px;border-radius:999px;
  background:var(--ink);color:var(--cream);font-size:11px;font-weight:600;white-space:nowrap}
.tag{position:absolute;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  width:66px;height:80px;padding:11px 0 12px;margin-left:-33px;border-radius:14px;background:var(--cream);color:var(--ink);
  font-size:11.5px;font-weight:700;letter-spacing:-.01em;box-shadow:0 12px 26px rgba(0,0,0,.3)}
.tag svg.i{width:19px;height:19px}
.copy{position:absolute;left:0;right:0;bottom:0;z-index:7;padding:0 18px 22px;text-align:center;pointer-events:none}
.copy .sub{margin:0 0 10px;font-size:13px;color:var(--on-stage-2)}
.copy h1{margin:0;color:var(--on-stage);font-size:clamp(40px,12.4vw,112px);text-shadow:0 2px 30px rgba(0,0,0,.25)}
.copy h1 .ln{display:block}
.copy h1 .ch{display:inline-block}
.cue{position:absolute;left:0;right:0;bottom:36px;z-index:8;margin:0;text-align:center;font-size:12.5px;color:var(--on-stage-2);opacity:0;pointer-events:none}
.cue i{display:block;width:1px;height:28px;margin:0 auto 10px;background:var(--on-stage-2);transform-origin:50% 0;animation:drip 2.2s cubic-bezier(.6,0,.3,1) infinite}
@keyframes drip{0%{transform:scaleY(0);opacity:1}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.js-anim .cue{opacity:1}
.js-anim .piece .ghost{opacity:.06}

/* idle float after the assembly */
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
.is-done .card{animation:bob 5.5s ease-in-out infinite}
.is-done .card:nth-child(2n){animation-duration:6.4s;animation-delay:-2s}
.is-done .card:nth-child(3n){animation-duration:7.2s;animation-delay:-3.5s}

/* ---------- 3. statement ---------- */
.state{padding:64px calc(var(--m) + 12px) 56px}
.state p{margin:0;font-size:31px;color:var(--ink)}
.state .ph{display:inline-block;vertical-align:-.16em;width:2.5em;height:1.12em;margin:0 .1em;border-radius:999px;overflow:hidden;background:var(--rim)}

.grid{columns:2;column-gap:10px}
.w{break-inside:avoid;margin:0 0 10px;position:relative;border-radius:18px;overflow:hidden;background:var(--rim);transition:opacity .35s, transform .35s}
.w.is-off{display:none}
.w button{display:block;width:100%;cursor:zoom-in}
.w img{width:100%;height:auto;opacity:0;transition:opacity .7s}
.w img.ok{opacity:1}
.w .lbl{position:absolute;left:8px;bottom:8px;right:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:7px 10px;border-radius:12px;background:rgba(233,230,212,.92);color:var(--ink);font-size:12px;line-height:1.35;pointer-events:none}
.w .lbl b{font-weight:700;min-width:0}
.w .lbl em{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}

/* ---------- 5. process (steps hang on a wire) ---------- */
.how{padding:56px 22px 60px}
.how h2{margin:0 0 34px;font-size:40px;color:var(--on-stage)}
.steps{position:relative;margin:0;padding:0 0 0 30px;list-style:none}
.steps::before{content:"";position:absolute;left:6px;top:-34px;bottom:12px;width:1px;background:linear-gradient(rgba(238,235,219,.08),rgba(238,235,219,.45))}
.steps li{position:relative;padding:0 0 30px}
.steps li::before{content:"";position:absolute;left:-30px;top:10px;width:13px;height:13px;border-radius:50%;background:var(--stage);box-shadow:inset 0 0 0 1.5px var(--cream)}
.steps li:last-child{padding-bottom:0}
.steps h3{margin:0 0 4px;font-size:26px;color:var(--on-stage)}
.steps p{margin:0;font-size:14px;color:var(--on-stage-2);max-width:24em}

/* ---------- 6. what + who ---------- */
.what{padding:64px calc(var(--m) + 12px) 40px}
.what h2{margin:0 0 18px;font-size:40px}
.index{margin:0;padding:0;list-style:none;border-top:1px solid rgba(20,26,12,.18)}
.index li{padding:12px 0;border-bottom:1px solid rgba(20,26,12,.18)}
.index b{font-family:var(--kr);font-weight:700;font-size:21px;letter-spacing:-.03em}
.who{margin-top:52px}
.who h3{margin:0 0 14px;font-size:13px;font-weight:600;color:var(--canvas-ink)}
.who ul{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.who li{display:inline-flex;align-items:baseline;gap:8px;padding:10px 16px;border-radius:999px;background:var(--paper)}
.who li b{font-family:var(--en);font-weight:400;font-size:17px;letter-spacing:-.01em}
.who li span{font-size:12px;color:var(--mute)}

/* ---------- 7. contact ---------- */
.contact{padding:56px 22px 26px}
.contact h2{margin:0 0 12px;font-size:40px;color:var(--on-stage)}
.contact .lead{margin:0 0 30px;font-size:14px;color:var(--on-stage-2)}
.tel{display:block;font-family:var(--en);font-size:clamp(34px,10.2vw,104px);line-height:1;letter-spacing:-.03em;color:var(--on-stage);white-space:nowrap}
.tel small{display:block;margin-top:10px;font-family:var(--ui);font-size:12.5px;letter-spacing:0;color:var(--on-stage-2)}
.alt{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 0}
.form{margin:40px 0 0;padding:20px 18px 22px;border-radius:20px;background:var(--cream);color:var(--ink)}
.form h3{margin:0 0 16px;font-size:22px}
.field{margin:0 0 14px;padding:0;border:0;min-width:0}
.field > label,.field legend{display:block;margin:0 0 6px;padding:0;font-size:13px;font-weight:600}
.field input[type=text],.field input[type=tel],.field textarea{width:100%;font:inherit;font-size:16px;line-height:1.5;color:var(--ink);
  background:var(--paper);border:1px solid rgba(20,26,12,.12);border-radius:12px;padding:12px 14px}
.field textarea{min-height:100px;resize:vertical}
.field input:focus-visible,.field textarea:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:999px;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(20,26,12,.14);font-size:13.5px;cursor:pointer}
.chips input:checked + span{background:var(--ink);color:var(--cream);box-shadow:none}
.chips input:focus-visible + span{outline:2px solid var(--ink);outline-offset:2px}
.consent{display:flex;gap:10px;align-items:flex-start;margin:4px 0 18px;font-size:12.5px;line-height:1.6;color:var(--ink-2);cursor:pointer}
.consent input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--ink);flex:none}
.form .pill{width:100%;justify-content:center;height:52px}
.msg{min-height:1.5em;margin:10px 0 0;font-size:13.5px;color:var(--red)}

/* ---------- footer ---------- */
.foot{padding:36px calc(var(--m) + 12px) calc(104px + env(safe-area-inset-bottom));color:var(--canvas-ink);font-size:13px;line-height:1.8}
.big{margin:0 0 18px;font-family:var(--en);font-size:clamp(120px,44vw,420px);line-height:.8;letter-spacing:-.05em;color:#8F8C4E}
.foot p{margin:0}
.foot a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}

/* ---------- dock (the hero pill, detached) ---------- */
.dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;gap:4px;padding:5px;border-radius:18px;width:max-content;
  background:rgba(20,26,12,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 12px 30px rgba(20,26,12,.3);
  transform:translate(-50%,150%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.dock.on{transform:translate(-50%,0)}
.dock a{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 14px;border-radius:13px;color:var(--cream);font-size:13.5px;font-weight:600;white-space:nowrap}
.dock a.call{background:var(--cream);color:var(--ink)}
.dock svg.i{width:16px;height:16px}

/* toast + lightbox */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;width:min(92vw,420px);padding:14px 18px;border-radius:16px;
  background:var(--ink);color:var(--cream);font-size:14px;line-height:1.6;box-shadow:0 10px 30px rgba(0,0,0,.25);
  opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:opacity .3s,transform .3s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lb{width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#0F1408;color:var(--on-stage)}
.lb::backdrop{background:transparent}
.lb-in{display:grid;grid-template-rows:minmax(0,1fr) auto;height:100%;padding:58px 14px calc(18px + env(safe-area-inset-bottom))}
.lb-st{display:grid;place-items:center;min-height:0}
.lb-st img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.lb-ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px}
.lb-cap{margin:0}.lb-cap b{display:block;font-family:var(--kr);font-weight:800;letter-spacing:-.03em;font-size:18px}.lb-cap span{font-size:13px;color:var(--on-stage-2)}
.lb-nav{display:flex;gap:8px}
.ib{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:13px;background:rgba(233,230,212,.12);color:var(--on-stage)}
.lb-x{position:absolute;top:10px;right:10px}

@media (prefers-reduced-motion: reduce){ .cue i{animation:none} .is-done .card{animation:none} .w img,.dock{transition:none} }

/* ---------- larger screens ---------- */
@media (min-width:720px){
  :root{--m:18px;--r:34px;--rim-w:10px}
  .meta{height:56px;font-size:13px}
  .top{padding:22px 22px 0 30px}
  .logo{font-size:32px}
  .seg a{width:44px;height:40px}
  .sq{width:48px;height:48px}
  .tag{width:78px;height:94px;margin-left:-39px;font-size:12.5px}
  .copy{padding-bottom:34px}
  .copy .sub{font-size:14.5px}
  .copy h1 .ln{display:inline}
  .copy h1 .ln + .ln::before{content:" "}
  .state{padding:120px calc(var(--m) + 40px) 100px}
  .state p{font-size:clamp(40px,4.6vw,66px);max-width:17em}
  .night{aspect-ratio:16/9}
  .night img.bg{object-position:50% 42%}
  .night blockquote{left:44px;bottom:40px;font-size:clamp(34px,3.6vw,52px)}
  .info{top:auto;left:auto;right:28px;bottom:36px;min-width:240px;padding:18px 20px 16px}
  .works{padding:120px calc(var(--m) + 40px) 60px}
  .head h2{font-size:clamp(56px,6vw,86px)}
  .grid{columns:3;column-gap:16px}
  .w{margin-bottom:16px;border-radius:24px}
  .how{padding:90px 64px 96px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px}
  .how h2{font-size:clamp(46px,4.6vw,66px)}
  .steps h3{font-size:34px}
  .what{padding:120px calc(var(--m) + 40px) 80px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:64px;align-items:start}
  .what h2{font-size:clamp(46px,4.6vw,66px)}
  .index b{font-size:28px}
  .who{margin-top:0}
  .contact{padding:90px 64px 56px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:56px;align-items:start}
  .contact h2{font-size:clamp(46px,4.6vw,66px)}
  .form{margin-top:0;padding:28px}
  .foot{padding-left:calc(var(--m) + 40px);padding-right:calc(var(--m) + 40px)}
  .dock{bottom:auto;top:18px;transform:translate(-50%,-160%)}
  .dock.on{transform:translate(-50%,0)}
  .toast{bottom:28px}
}
</style>
</head>
<body>
<main>
  <!-- 1+2. 히어로: 무대 안에서 작품이 조립됨 (공개 고지 줄 포함) -->
  <section class="hero" id="hero" aria-label="소개">
    <div class="meta" id="meta"><span id="meta-l"></span><span class="plus" aria-hidden="true"></span><span id="meta-r"></span></div>
    <div class="panel dark stage grain" id="stage">
      <span class="glow"></span><span class="floor"></span>
      <div class="top">
        <a class="logo" id="logo" href="#hero"></a>
        <nav class="seg" aria-label="바로가기">
          <a href="#works" aria-label="작업 보기"><span data-i="grid"></span></a>
          <a href="#how" aria-label="진행 방식"><span data-i="leaf"></span></a>
          <a id="seg-ig" href="#" target="_blank" rel="noopener" aria-label="인스타그램"><span data-i="ig"></span></a>
          <a id="seg-call" class="on" href="#" aria-label="전화 상담"><span data-i="phone"></span></a>
        </nav>
        <a class="sq" href="#foot" aria-label="작업 지역 보기"><span data-i="pin"></span></a>
      </div>
      <div class="scene" id="scene">
        <span class="wire" id="wire"></span>
        <div class="piece" id="piece"><img class="ghost" id="ghost" alt="" aria-hidden="true"></div>
        <a class="tag" id="tag" href="#"><span id="tag-t"></span><span data-i="phone"></span></a>
      </div>
      <div class="copy" id="copy">
        <p class="sub" id="sub"></p>
        <h1 class="kr" id="h1"></h1>
      </div>
      <p class="cue" id="cue"><i></i><span></span></p>
    </div>
  </section>

  <!-- 소개 문장 -->
  <section class="state" aria-label="ikki archive 소개">
    <p class="kr" id="statement"></p>
    <ul class="facts" id="facts"></ul>
  </section>

  <!-- 대표 작업 -->
  <section class="panel dark night" id="night" aria-label="대표 작업">
    <img class="bg" id="night-img" loading="lazy" decoding="async">
    <span class="shade"></span>
    <div class="info" id="info"></div>
    <blockquote class="kr" id="quote"></blockquote>
  </section>

  <!-- 3. 작업 -->
  <section class="works" id="works" aria-labelledby="works-h">
    <div class="head"><h2 class="kr" id="works-h">작업</h2></div>
    <p class="lead" id="works-lead"></p>
    <div class="filters" id="filters" role="group" aria-label="공간 종류로 거르기"></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- 5. 진행 방식 -->
  <section class="panel dark how grain" id="how" aria-labelledby="how-h">
    <h2 class="kr" id="how-h">이렇게<br>진행합니다</h2>
    <ol class="steps" id="steps"></ol>
  </section>

  <!-- 하는 일 + 4. 함께한 곳 -->
  <section class="what" aria-labelledby="what-h">
    <div>
      <h2 class="kr" id="what-h">하는 일</h2>
      <ul class="index" id="index"></ul>
    </div>
    <div class="who" id="who">
      <h3>함께한 곳</h3>
      <ul id="who-list"></ul>
    </div>
  </section>

  <!-- 6. 문의 -->
  <section class="panel dark contact grain" id="contact" aria-labelledby="contact-h">
    <div>
      <h2 class="kr" id="contact-h">어떤 공간에<br>숲을 들일까요</h2>
      <p class="lead">작은 공간도 괜찮습니다. 편한 방법으로 연락 주세요.</p>
      <a class="tel" id="tel" href="#"></a>
      <div class="alt" id="alt"></div>
    </div>
    <form class="form" id="form" novalidate>
      <h3 class="kr">문의 남기기</h3>
      <div class="field"><label for="f-name">이름</label><input type="text" id="f-name" autocomplete="name"></div>
      <div class="field"><label for="f-phone">연락처</label><input type="tel" id="f-phone" autocomplete="tel" inputmode="tel" placeholder="010-0000-0000"></div>
      <fieldset class="field"><legend>공간 종류</legend><div class="chips" id="chips"></div></fieldset>
      <div class="field"><label for="f-size">공간 크기 (평수)</label><input type="text" id="f-size" placeholder="예: 카페 40평, 거실 한쪽 벽"></div>
      <div class="field"><label for="f-body">내용</label><textarea id="f-body" placeholder="원하는 분위기, 일정, 예산을 편하게 적어 주세요."></textarea></div>
      <label class="consent"><input type="checkbox" id="f-consent"><span>문의에 답하기 위해 이름과 연락처를 수집하는 데 동의합니다.</span></label>
      <button type="submit" class="pill pill-dark">문의 남기기</button>
      <p class="msg" id="msg" role="alert"></p>
    </form>
  </section>
</main>

<!-- 7. 푸터 -->
<footer class="foot" id="foot"></footer>

<nav class="dock" id="dock" aria-label="빠른 문의">
  <a href="#works"><span data-i="grid"></span><span>작업</span></a>
  <a id="dock-ig" href="#" target="_blank" rel="noopener"><span data-i="ig"></span><span>DM</span></a>
  <a class="call" id="dock-call" href="#"><span data-i="phone"></span><span>전화 상담</span></a>
</nav>

<dialog class="lb" id="lb" aria-label="사진 크게 보기">
  <div class="lb-in">
    <div class="lb-st"><img id="lb-img" alt=""></div>
    <div class="lb-ft">
      <p class="lb-cap" id="lb-cap"></p>
      <div class="lb-nav">
        <button type="button" class="ib" id="lb-prev" aria-label="이전 사진"><span data-i="prev"></span></button>
        <button type="button" class="ib" id="lb-next" aria-label="다음 사진"><span data-i="next"></span></button>
      </div>
    </div>
  </div>
  <button type="button" class="ib lb-x" id="lb-x" aria-label="닫기"><span data-i="x"></span></button>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const C = CONFIG, $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const S = (d, extra) => '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  const I = {
    grid: S('<rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/>'),
    leaf: S('<path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 19l7-7"/>'),
    ig: S('<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17" cy="7" r=".5" fill="currentColor"/>'),
    phone: S('<path d="M5 4h3.2l1.6 4-2 1.3a10.5 10.5 0 0 0 6.9 6.9l1.3-2 4 1.6V19a1.6 1.6 0 0 1-1.7 1.6A15.6 15.6 0 0 1 3.4 5.7 1.6 1.6 0 0 1 5 4z"/>'),
    pin: S('<path d="M12 21s-6.5-6.2-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.3"/>'),
    prev: S('<path d="M14.5 5.5 8 12l6.5 6.5"/>'), next: S('<path d="M9.5 5.5 16 12l-6.5 6.5"/>'), x: S('<path d="M6 6l12 12M18 6 6 18"/>')
  };
  const tel = 'tel:' + C.phone.replace(/[^\d+]/g, '');
  const dm = C.instagram ? 'https://ig.me/m/' + C.instagram : '';
  const ig = C.instagram ? 'https://www.instagram.com/' + C.instagram + '/' : '';
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* disclosure row */
  $('#meta-l').textContent = C.notice.left; $('#meta-r').textContent = C.notice.right;
  if (!C.notice.left && !C.notice.right) $('#meta').hidden = true;

  /* hero */
  $('#logo').textContent = C.mark;
  $('#seg-call').href = tel; $('#dock-call').href = tel; $('#tag').href = tel;
  if (dm) { $('#seg-ig').href = dm; $('#dock-ig').href = dm; } else { $('#seg-ig').hidden = true; $('#dock-ig').hidden = true; }
  $('#tag-t').textContent = C.hero.chip;
  $('#sub').textContent = C.hero.sub;
  $('#cue span').textContent = C.hero.cue;
  const h1 = $('#h1'); h1.setAttribute('aria-label', C.hero.headline.join(' '));
  h1.innerHTML = C.hero.headline.map((ln) => '<span class="ln" aria-hidden="true">' + Array.from(ln).map((ch) => ch === ' ' ? ' ' : '<span class="ch">' + esc(ch) + '</span>').join('') + '</span>').join('');
  const P = C.hero.piece, piece = $('#piece');
  $('#ghost').src = P.all;
  const layers = P.layers.map((L, i) => {
    const im = document.createElement('img'); im.className = 'layer ' + L.key; im.alt = ''; im.decoding = 'async'; im.src = L.src;
    im.style.left = L.x + '%'; im.style.top = L.y + '%'; im.style.width = L.w + '%'; im.style.zIndex = 2 + i;
    piece.appendChild(im); return im;
  });
  piece.setAttribute('role', 'img'); piece.setAttribute('aria-label', 'ikki archive 행잉 작품');
  const scene = $('#scene');
  const cards = C.hero.cards.map((c) => {
    const el = document.createElement('div'); el.className = 'card'; el.setAttribute('aria-hidden', 'true');
    el.innerHTML = '<img src="' + esc(c.src) + '" alt="" decoding="async"><span>' + esc(c.label) + '</span>';
    scene.insertBefore(el, piece); return el;
  });

  /* geometry: piece size, wire, arc of cards — all from the stage box */
  const stage = $('#stage'), wire = $('#wire'), tag = $('#tag');
  const G = { w: 0, h: 0, pw: 0, ph: 0, px: 0, py: 0, cx: 0, cy: 0, rx: 0, ry: 0, cs: 0, base: [] };
  /* card angles on the arc (degrees, 90 = straight up). Inner cards sit high beside the piece,
     outer cards drop lower and get cut by the frame edge, the way Kumo frames its flavour cards. */
  const BASE_WIDE = [166, 121, 59, 14, null], BASE_PHONE = [166, 128, 52, 14, null];
  const arc = { off: 0, fly: 0 };               // off: rotation along the arc, fly: 1 = cards outside
  function layout() {
    const r = stage.getBoundingClientRect(); G.w = r.width; G.h = r.height;
    const wide = G.w >= 720;
    const copyH = $('#copy').offsetHeight;
    const top = wide ? 100 : 80;
    const tagOver = wide ? 44 : 34;                 /* the call tag hangs below the piece */
    const avail = G.h - top - copyH - tagOver - (wide ? 24 : 14);
    G.ph = Math.max(180, Math.min(avail, (wide ? G.w * 0.33 : G.w * 0.8) / P.ratio));
    G.pw = G.ph * P.ratio; G.px = (G.w - G.pw) / 2; G.py = top + Math.max(0, (avail - G.ph) * (wide ? 0.45 : 0.72));
    Object.assign(piece.style, { left: G.px + 'px', top: G.py + 'px', width: G.pw + 'px', height: G.ph + 'px' });
    const seg = $('.seg').getBoundingClientRect();
    const tx = G.px + G.pw * P.tip.x / 100, ty = G.py + G.ph * P.tip.y / 100, wy = seg.bottom - r.top;
    Object.assign(wire.style, { left: tx + 'px', top: wy + 'px', height: Math.max(0, ty - wy) + 'px' });
    tag.style.left = (G.w / 2) + 'px'; tag.style.top = (G.py + G.ph * 0.86) + 'px';
    G.cs = Math.round(wide ? Math.min(176, G.w * 0.115) : Math.max(70, Math.min(100, G.w * 0.235)));
    stage.style.setProperty('--cs', G.cs + 'px');
    G.base = wide ? BASE_WIDE : BASE_PHONE;
    G.cx = G.w / 2;
    G.cy = G.py + G.ph * (wide ? 0.74 : 0.6);
    G.rx = wide ? G.w * 0.43 : G.w * 0.54;
    G.ry = G.ph * (wide ? 0.36 : 0.3);
    place();
  }
  function place() {
    cards.forEach((el, i) => {
      const b = G.base[i];
      if (b == null) { el.style.display = 'none'; return; }
      el.style.display = '';
      const dir = b > 90 ? 1 : -1;
      const ang = b + arc.off + dir * 75 * arc.fly;
      const a = ang * Math.PI / 180;
      const x = G.cx + Math.cos(a) * G.rx, y = G.cy - Math.sin(a) * G.ry;
      const rot = (90 - (b + arc.off)) * 0.42 + dir * -40 * arc.fly;
      el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + rot.toFixed(1) + 'deg)';
      el.style.left = '0px'; el.style.top = '0px';
      el.style.opacity = String(Math.max(0, 1 - arc.fly * 1.6));
    });
  }

  /* statement */
  $('#statement').innerHTML = C.statement.map((s) => s.img
    ? ' <span class="ph"><img src="' + esc(s.img) + '" alt="' + esc(s.alt) + '" loading="lazy"></span> '
    : esc(s.t)).join(' ');
  $('#facts').innerHTML = C.facts.map((f) => '<li>' + esc(f) + '</li>').join('');

  /* night chapter */
  const ch = C.chapter, ni = $('#night-img');
  ni.src = ch.src; ni.alt = ch.alt; ni.width = ch.w; ni.height = ch.h;
  $('#info').innerHTML = '<b>' + esc(ch.place) + '</b><small>' + esc(ch.date) + '</small><dl>' + ch.rows.map((r) => '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>').join('') + '</dl>';
  $('#quote').innerHTML = ch.quote.map((l) => '<span>' + esc(l) + '</span>').join('');

  /* works + filter */
  $('#works-lead').textContent = C.worksIntro;
  const grid = $('#grid');
  C.works.forEach((p, i) => {
    const el = document.createElement('figure'); el.className = 'w'; el.dataset.cat = p.cat;
    el.innerHTML = '<button type="button" aria-label="' + esc(p.title) + ' 사진 크게 보기"><img alt="' + esc(p.alt) + '" width="' + p.w + '" height="' + p.h + '" loading="lazy" decoding="async"></button>' +
      '<figcaption class="lbl"><b>' + esc(p.title) + '</b><em>' + esc(p.year) + '</em></figcaption>';
    const img = el.querySelector('img');
    img.addEventListener('load', () => img.classList.add('ok')); img.src = p.src;
    if (img.complete && img.naturalWidth) img.classList.add('ok');
    el.querySelector('button').addEventListener('click', () => openLB(i));
    grid.appendChild(el);
  });
  const fwrap = $('#filters');
  fwrap.innerHTML = C.filters.map((f, i) => '<button type="button" aria-pressed="' + (i === 0) + '">' + esc(f) + '</button>').join('');
  fwrap.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    $$('button', fwrap).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    const f = b.textContent;
    $$('.w', grid).forEach((w) => w.classList.toggle('is-off', f !== C.filters[0] && w.dataset.cat !== f));
    if (window.ScrollTrigger) ScrollTrigger.refresh();
  });

  /* process, services, credits */
  $('#steps').innerHTML = C.process.map((s) => '<li><h3 class="kr">' + esc(s.name) + '</h3><p>' + esc(s.desc) + '</p></li>').join('');
  $('#index').innerHTML = C.services.map((s) => '<li><b>' + esc(s) + '</b></li>').join('');
  if (C.credits.length) $('#who-list').innerHTML = C.credits.map((c) => '<li><b>' + esc(c.client) + '</b><span>' + esc(c.project) + '</span></li>').join('');
  else $('#who').hidden = true;

  /* contact */
  const telA = $('#tel'); telA.href = tel; telA.innerHTML = esc(C.phone) + '<small>누르면 바로 전화가 연결됩니다</small>';
  const alt = [];
  if (dm) alt.push('<a class="pill pill-line" href="' + dm + '" target="_blank" rel="noopener">' + I.ig + '<span>인스타그램 DM</span></a>');
  if (C.kakaoUrl) alt.push('<a class="pill pill-line" href="' + esc(C.kakaoUrl) + '" target="_blank" rel="noopener"><span>카카오톡 문의</span></a>');
  $('#alt').innerHTML = alt.join('');
  $('#chips').innerHTML = C.spaceTypes.map((t) => '<label><input type="radio" name="space" value="' + esc(t) + '"><span>' + esc(t) + '</span></label>').join('');
  const form = $('#form'), msg = $('#msg');
  form.addEventListener('submit', (e) => {
    e.preventDefault(); let err = '';
    if (!$('#f-name').value.trim()) err = '이름을 입력해 주세요.';
    else if (!/\d{2,}/.test($('#f-phone').value)) err = '연락처를 입력해 주세요.';
    else if (!$('#f-consent').checked) err = '개인정보 수집에 동의해 주세요.';
    msg.textContent = err; if (err) return;
    toast('시안 화면이라 실제로 전송되지는 않습니다. 정식 오픈 후에는 이 문의가 사장님 휴대폰 문자로 바로 갑니다.');
    form.reset();
  });

  /* footer */
  const f = ['<p class="big" aria-hidden="true">' + esc(C.mark) + '</p>', '<p><b>' + esc(C.bizName) + '</b>  실내조경, 이끼정원, 행잉 작품</p>',
    '<p>전화 <a href="' + tel + '">' + esc(C.phone) + '</a></p>'];
  if (ig) f.push('<p>인스타그램 <a href="' + ig + '" target="_blank" rel="noopener">@' + esc(C.instagram) + '</a></p>');
  if (C.area) f.push('<p>작업 지역 ' + esc(C.area) + '</p>');
  if (C.bizInfo.owner || C.bizInfo.regNo) f.push('<p>' + esc([C.bizInfo.owner && '대표 ' + C.bizInfo.owner, C.bizInfo.regNo && '사업자등록번호 ' + C.bizInfo.regNo].filter(Boolean).join(', ')) + '</p>');
  if (C.notice.left) f.push('<p style="margin-top:14px">이 페이지는 ' + esc(C.bizName) + '에 보여드리기 위해 WeThru가 만든 시안입니다.</p>');
  $('#foot').innerHTML = f.join('');

  /* toast + lightbox */
  const toastEl = $('#toast'); let tt;
  function toast(t) { toastEl.textContent = t; toastEl.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('on'), 5200); }
  const lb = $('#lb'), lbImg = $('#lb-img'), lbCap = $('#lb-cap'); let cur = 0;
  function show() { const p = C.works[cur]; lbImg.src = p.src; lbImg.alt = p.alt; lbCap.innerHTML = '<b>' + esc(p.title) + '</b><span>' + esc(p.note + ', ' + p.year) + '</span>'; }
  function openLB(i) { cur = i; show(); if (lb.showModal) lb.showModal(); else lb.setAttribute('open', ''); }
  const step = (d) => { cur = (cur + d + C.works.length) % C.works.length; show(); };
  $('#lb-prev').addEventListener('click', () => step(-1)); $('#lb-next').addEventListener('click', () => step(1));
  $('#lb-x').addEventListener('click', () => lb.close());
  lb.addEventListener('click', (e) => { if (e.target === lb || e.target.classList.contains('lb-st')) lb.close(); });
  lb.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
  let sx = null;
  lb.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', (e) => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); sx = null; });

  $$('[data-i]').forEach((n) => { n.outerHTML = I[n.dataset.i] || ''; });

  /* dock appears once the hero is behind you */
  const dock = $('#dock'), hero = $('#hero'), contact = $('#contact');
  let heroEnd = 0;
  function onScroll() {
    const y = window.scrollY, vh = window.innerHeight, cr = contact.getBoundingClientRect();
    dock.classList.toggle('on', y > heroEnd + vh * 0.25 && !(cr.top < vh * 0.6 && cr.bottom > vh * 0.3));
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  layout();
  window.addEventListener('resize', () => { layout(); });
  heroEnd = hero.offsetTop + hero.offsetHeight - window.innerHeight; onScroll();

  /* the assembly — pinned scroll; without GSAP or with reduced motion the finished scene shows */
  function finish() { stage.classList.add('is-done'); }
  function start() {
    if (reduce || !window.gsap || !window.ScrollTrigger) { finish(); return; }
    gsap.registerPlugin(ScrollTrigger);
    ScrollTrigger.config({ ignoreMobileResize: true });
    document.documentElement.classList.add('js-anim');
    const [cone, middle, ring, strands] = layers;
    const chars = $$('#h1 .ch'), cue = $('#cue');
    const drop = (k) => () => -(G.py + G.ph) * k;
    arc.fly = 1; place();
    gsap.set(chars, { opacity: 0, y: '0.25em' }); gsap.set(tag, { opacity: 0, y: 14, scale: .92 });
    const tl = gsap.timeline({
      defaults: { ease: 'none' },
      scrollTrigger: { trigger: hero, start: 'top top', end: () => '+=' + Math.round(window.innerHeight * 2.1), pin: true, scrub: 0.7,
        anticipatePin: 1, invalidateOnRefresh: true,
        onLeave: finish, onEnterBack: () => stage.classList.remove('is-done'),
        onRefresh: (st) => { heroEnd = st.end; onScroll(); } }
    });
    tl.to(cue, { opacity: 0, duration: 0.05 }, 0.01)
      .fromTo(wire, { scaleY: 0 }, { scaleY: 1, duration: 0.1, ease: 'power1.inOut' }, 0)
      .fromTo(cone,   { y: drop(1.1), rotate: -7, opacity: 0 }, { y: 0, rotate: 0, opacity: 1, duration: 0.17, ease: 'power2.out' }, 0.07)
      .fromTo(middle, { y: drop(1.2), rotate: 6,  opacity: 0 }, { y: 0, rotate: 0, opacity: 1, duration: 0.17, ease: 'power2.out' }, 0.22)
      .fromTo(ring,   { y: drop(1.3), rotate: -4, opacity: 0 }, { y: 0, rotate: 0, opacity: 1, duration: 0.17, ease: 'power2.out' }, 0.37)
      .fromTo(strands, { '--rv': '0%', y: -10 }, { '--rv': '130%', y: 0, duration: 0.14, ease: 'power1.out' }, 0.52)
      .to('#ghost', { opacity: 0, duration: 0.08 }, 0.6)
      .fromTo(chars, { opacity: 0, y: '0.25em' }, { opacity: 1, y: 0, duration: 0.03, stagger: 0.045 }, 0.1)
      .to(arc, { fly: 0, duration: 0.2, ease: 'power2.out', onUpdate: place }, 0.62)
      .to(tag, { opacity: 1, y: 0, scale: 1, duration: 0.07, ease: 'back.out(2)' }, 0.78)
      .to(arc, { off: () => (G.w >= 720 ? -9 : -3), duration: 0.14, onUpdate: place }, 0.84)
      .to({}, { duration: 0.02 });
    gsap.fromTo('#night-img', { scale: 1.14 }, { scale: 1, ease: 'none', scrollTrigger: { trigger: '#night', start: 'top bottom', end: 'bottom top', scrub: true } });
  }
  if (window.gsap && window.ScrollTrigger) start(); else window.addEventListener('load', start);
});
</script>
</body>
</html>
