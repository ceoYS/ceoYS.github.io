<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ECEFE8">
<title>ikki archive | 부산 실내조경, 플랜테리어, 이끼정원</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%233F5A28'/%3E%3Ccircle cx='16' cy='20' r='6' fill='%23CFD8B6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@200..700&display=swap">
<style>
:root{
  --mist:#ECEFE8; --mist-2:#E0E6D8; --pebble:#F7F8F4;
  --ink:#1F261C; --stone:#6B7166; --line:rgba(31,38,28,.13);
  --moss:#3F5A28; --moss-hi:#4C6B31; --lichen:#CFD8B6;
  --floor:#25321F; --floor-2:#2F3E28; --floor-text:#E8ECE0; --floor-mute:#AEB8A2; --floor-line:rgba(232,236,224,.18);
  --serif:"Hahmlet","Noto Serif KR","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --pad:20px; --maxw:1200px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.75;font-weight:400;
  word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--moss);outline-offset:3px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
[hidden]{display:none!important}

/* buttons: pebble-shaped */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:0 22px;border-radius:999px;
  border:1px solid transparent;font-size:16px;font-weight:500;letter-spacing:-.005em;text-decoration:none;cursor:pointer;
  transition:background-color .2s, color .2s, border-color .2s}
.btn svg{width:18px;height:18px;flex:none}
.btn-moss{background:var(--moss);color:var(--pebble)}
.btn-moss:hover{background:var(--moss-hi)}
.btn-line{border-color:rgba(31,38,28,.55);color:var(--ink);background:transparent}
.btn-line:hover{border-color:var(--ink)}
.btn-lichen{background:var(--lichen);color:var(--floor)}
.btn-lichen:hover{background:#DCE4C5}
.btn-ghost{border-color:rgba(232,236,224,.45);color:var(--floor-text);background:transparent}
.btn-ghost:hover{border-color:var(--floor-text)}

/* preview notice: plain, always first on the page */
.notice{margin:0;padding:9px var(--pad);background:var(--ink);color:var(--mist);font-size:12.5px;line-height:1.55;text-align:center}

/* 1. sticky bar */
.bar{position:sticky;top:0;z-index:40;height:56px;display:flex;align-items:center;
  transition:background-color .3s, box-shadow .3s}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;width:100%}
.bar.is-solid{background:rgba(236,239,232,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line)}
.mark{font-size:21px;font-weight:600;letter-spacing:-.015em;color:var(--moss);text-decoration:none;line-height:1}
.bar .btn{min-height:38px;padding:0 15px;font-size:14px;gap:7px}
.bar .btn svg{width:15px;height:15px}

/* 2. hero */
.hero{padding:28px 0 64px}
.hero-grid{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;align-items:start}
/* 세로쓰기: 폰트 세로 메트릭에 기대지 않고 글자를 한 자씩 쌓아 간격을 직접 제어 */
.hero-title{margin:0;display:flex;flex-direction:column;align-items:center;font-weight:300;
  font-size:clamp(28px,8vw,56px);line-height:1.08;color:var(--ink)}
.hero-title .ch{display:block}
.hero-title .sp{display:block;height:.42em}
.hero-figure{margin:0}
.hero-figure figcaption{margin-top:9px;font-size:13px;line-height:1.5;color:var(--stone)}
.hero-body{grid-column:1 / -1;margin-top:30px}
.hero-name{margin:0 0 8px;font-size:23px;font-weight:600;letter-spacing:-.015em;color:var(--moss);line-height:1.3}
.lede{margin:0 0 12px;font-size:17px;line-height:1.75;max-width:30em}
.cred{margin:0 0 26px;font-size:13.5px;line-height:1.6;color:var(--stone)}
.cta{display:grid;gap:10px}

/* image frames */
.ph{position:relative;display:block;width:100%;padding:0;border:0;background:var(--mist-2);border-radius:2px;overflow:hidden}
.ph img{width:100%;height:auto;opacity:0;transition:opacity .7s ease}
.ph img.is-loaded{opacity:1}
.ph::after{content:attr(data-label);position:absolute;inset:0;display:none;place-items:center;padding:14px;
  text-align:center;font-size:14px;line-height:1.5;color:var(--stone)}
.ph.is-missing img{visibility:hidden}
.ph.is-missing::after{display:grid}
button.ph{cursor:zoom-in}

/* 3. gallery */
.archive{padding:40px 0 24px}
.sec-title{margin:0 0 10px;font-size:28px;font-weight:300;line-height:1.35;letter-spacing:-.01em}
.sec-intro{margin:0 0 34px;font-size:15.5px;line-height:1.75;color:var(--stone);max-width:30em}
.masonry{columns:2;column-gap:14px}
.masonry figure{break-inside:avoid;margin:0 0 24px}
.masonry figcaption{padding-top:9px}
.masonry .t{display:block;font-size:14.5px;font-weight:500;line-height:1.45}
.masonry .n{display:block;font-size:12.5px;line-height:1.55;color:var(--stone)}
.quote{margin:64px 0 0;padding:0 0 104px 10%}
.quote p{margin:0;max-width:14em;font-size:clamp(23px,6vw,40px);font-weight:250;line-height:1.55;letter-spacing:-.01em}

/* 4. reviews / credits */
.ground{background:var(--mist-2)}
.reviews,.credits{padding:80px 0 24px}
.review-list{display:grid;gap:28px;margin:0;padding:0;list-style:none}
.review-list blockquote{margin:0;font-size:17px;line-height:1.8}
.review-list footer{margin-top:8px;font-size:13px;color:var(--stone)}
.credit-list{margin:0;padding:0;list-style:none}
.credit-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;padding:15px 0 16px;border-top:1px solid var(--line)}
.credit-list li:last-child{border-bottom:1px solid var(--line)}
.credit-list .c{grid-column:1;grid-row:1;font-size:17px;font-weight:500;line-height:1.5}
.credit-list .y{grid-column:2;grid-row:1;font-size:13px;line-height:1.9;color:var(--stone);font-variant-numeric:tabular-nums;text-align:right}
.credit-list .p{grid-column:1 / -1;grid-row:2;font-size:14px;line-height:1.6;color:var(--stone)}

/* 5. services */
.services{padding:72px 0 96px}
.svc-list{display:grid;gap:22px;margin:0;padding:0;list-style:none}
.svc-list h3{margin:0;font-size:17px;font-weight:500;line-height:1.5}
.svc-list p{margin:3px 0 0;font-size:14.5px;line-height:1.7;color:var(--stone);max-width:28em}
.process{margin-top:72px}
.sub-title{margin:0 0 22px;font-size:21px;font-weight:300;line-height:1.4}
.steps{display:grid;gap:22px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:10px}
.steps .num{font-size:30px;font-weight:200;line-height:1.05;color:var(--moss)}
.steps h3{margin:0;font-size:17px;font-weight:500;line-height:1.5}
.steps p{margin:3px 0 0;font-size:14.5px;line-height:1.7;color:var(--stone)}
.area{margin:56px 0 0;font-size:15.5px;line-height:1.75;max-width:32em}

/* 6. contact */
.contact{background:var(--floor);color:var(--floor-text);padding:88px 0 0}
.contact .sec-title{color:var(--floor-text)}
.contact .sec-intro{color:var(--floor-mute);margin-bottom:28px}
.form{margin-top:40px;padding:24px 20px 26px;background:var(--floor-2);border-radius:16px}
.form h3{margin:0 0 18px;font-size:19px;font-weight:400}
.field{margin:0 0 16px;padding:0;border:0;min-width:0}
.field > label,.field legend{display:block;margin:0 0 7px;padding:0;font-size:14px;color:var(--floor-text)}
.field input[type=text],.field input[type=tel],.field textarea{width:100%;font:inherit;font-size:16px;line-height:1.5;color:var(--ink);
  background:var(--pebble);border:1px solid transparent;border-radius:10px;padding:12px 14px}
.field textarea{min-height:110px;resize:vertical}
.field input:focus-visible,.field textarea:focus-visible{outline:2px solid var(--lichen);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:inline-flex;align-items:center;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--floor-line);
  font-size:14px;cursor:pointer;transition:background-color .2s,color .2s,border-color .2s}
.chips input:checked + span{background:var(--lichen);border-color:var(--lichen);color:var(--floor)}
.chips input:focus-visible + span{outline:2px solid var(--lichen);outline-offset:2px}
.consent{display:flex;gap:10px;align-items:flex-start;margin:4px 0 20px;font-size:13.5px;line-height:1.6;color:var(--floor-mute);cursor:pointer}
.consent input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--lichen);flex:none}
.form .btn{width:100%}
.form-msg{min-height:1.6em;margin:12px 0 0;font-size:14px;color:#F0D9A8}

/* 7. footer */
.foot{padding:64px 0 48px;font-size:13.5px;line-height:1.8;color:var(--floor-mute)}
.foot .mark{display:inline-block;margin-bottom:12px;color:var(--floor-text)}
.foot p{margin:0}
.foot a{text-decoration:none}
.foot a:hover{text-decoration:underline}
.foot .note{margin-top:24px;padding-top:18px;border-top:1px solid var(--floor-line);font-size:12.5px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:60;width:min(92vw,440px);
  padding:14px 18px;border-radius:14px;background:var(--ink);color:var(--pebble);font-size:14.5px;line-height:1.6;
  box-shadow:0 10px 30px rgba(20,26,18,.25);opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:opacity .3s, transform .3s}
.toast.is-on{opacity:1;transform:translate(-50%,0)}

/* lightbox */
.lb{width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#161C14;color:var(--floor-text)}
.lb::backdrop{background:transparent}
.lb-inner{display:grid;grid-template-rows:minmax(0,1fr) auto;height:100%;padding:58px 14px calc(18px + env(safe-area-inset-bottom))}
.lb-stage{display:grid;place-items:center;min-height:0}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:2px}
.lb-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px}
.lb-cap .t{display:block;font-size:15px;font-weight:500}
.lb-cap .n{display:block;font-size:13px;color:var(--floor-mute)}
.lb-nav{display:flex;gap:8px;flex:none}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:999px;border:1px solid var(--floor-line);background:transparent;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.lb-close{position:absolute;top:8px;right:10px;border:0}

/* the one orchestrated moment: page-load reveal in the hero */
@media (prefers-reduced-motion: no-preference){
  .js .hero-title .ch{opacity:0;animation:settle .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(.35s + var(--i) * 75ms)}
  .js .hero-figure .ph{clip-path:inset(100% 0 0 0);animation:grow 1.3s cubic-bezier(.65,.05,.25,1) .1s forwards}
  @keyframes settle{from{opacity:0;transform:translateY(-.3em);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
  @keyframes grow{to{clip-path:inset(0 0 0 0)}}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .ph img{transition:none}
}

/* wider screens */
@media (min-width:720px){
  :root{--pad:36px}
  .svc-list{grid-template-columns:1fr 1fr;column-gap:48px;row-gap:28px}
  .form{padding:32px 32px 34px}
}
@media (min-width:960px){
  :root{--pad:48px}
  .bar{height:68px}
  .hero{padding:64px 0 104px}
  .hero-grid{grid-template-columns:auto minmax(0,5fr) minmax(0,4fr);column-gap:48px;align-items:end}
  .hero-title{align-self:start}
  .hero-body{grid-column:auto;margin:0;padding-bottom:30px}
  .hero-name{font-size:28px}
  .lede{font-size:18px}
  .cta{grid-auto-flow:row;justify-items:start}
  .cta .btn{min-width:300px}
  .sec-title{font-size:38px}
  .archive{padding-top:64px}
  .masonry{columns:3;column-gap:28px}
  .masonry figure{margin-bottom:40px}
  .quote{padding:0 0 140px 30%}
  .credits,.reviews{padding-top:112px}
  .credit-list li{grid-template-columns:260px minmax(0,1fr) auto;align-items:baseline}
  .credit-list .p{grid-column:2;grid-row:1;font-size:15px}
  .credit-list .y{grid-column:3}
  .steps{grid-template-columns:repeat(4,minmax(0,1fr));gap:36px}
  .steps li{grid-template-columns:1fr;row-gap:12px}
  .contact{padding-top:120px}
  .contact-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);column-gap:72px;align-items:start}
  .contact-grid .form{margin-top:0}
  .lb-inner{padding:64px 40px 28px}
}
</style>
</head>
<body>

<p class="notice" id="notice" hidden></p>

<!-- 1. 상단 고정 바 -->
<header class="bar" id="bar">
  <div class="wrap">
    <a class="mark" id="bar-mark" href="#top"></a>
    <a class="btn btn-moss" id="bar-call" href="#"><span data-icon="phone"></span><span>전화하기</span></a>
  </div>
</header>

<main id="top">
  <!-- 2. 히어로 -->
  <section class="hero" aria-labelledby="hero-title">
    <div class="wrap hero-grid">
      <h1 class="hero-title" id="hero-title"></h1>
      <figure class="hero-figure">
        <span class="ph" id="hero-ph"><img id="hero-img" fetchpriority="high"></span>
        <figcaption id="hero-cap"></figcaption>
      </figure>
      <div class="hero-body">
        <p class="hero-name" id="hero-name"></p>
        <p class="lede" id="hero-lede"></p>
        <p class="cred" id="hero-cred"></p>
        <div class="cta" id="hero-cta"></div>
      </div>
    </div>
  </section>

  <!-- 3. 시공 사진 갤러리 -->
  <section class="archive" aria-labelledby="archive-title">
    <div class="wrap">
      <h2 class="sec-title" id="archive-title">작업 기록</h2>
      <p class="sec-intro" id="archive-intro"></p>
      <div class="masonry" id="gallery"></div>
      <blockquote class="quote" id="quote"><p></p></blockquote>
    </div>
  </section>

  <div class="ground">
    <!-- 4. 후기 (원문 없으면 숨김) / 함께 작업한 곳 -->
    <section class="reviews" id="reviews" aria-labelledby="reviews-title" hidden>
      <div class="wrap">
        <h2 class="sec-title" id="reviews-title">맡겨 주신 분들의 이야기</h2>
        <ul class="review-list" id="review-list"></ul>
      </div>
    </section>
    <section class="credits" id="credits" aria-labelledby="credits-title">
      <div class="wrap">
        <h2 class="sec-title" id="credits-title">함께 작업한 곳</h2>
        <p class="sec-intro">인테리어 회사와 카페, 전시 부스의 의뢰로 작업했습니다.</p>
        <ul class="credit-list" id="credit-list"></ul>
      </div>
    </section>

    <!-- 5. 시공 범위 -->
    <section class="services" aria-labelledby="svc-title">
      <div class="wrap">
        <h2 class="sec-title" id="svc-title">이런 공간을 만듭니다</h2>
        <ul class="svc-list" id="svc-list"></ul>
        <div class="process">
          <h3 class="sub-title">진행 순서</h3>
          <ol class="steps" id="steps"></ol>
        </div>
        <p class="area" id="area"></p>
      </div>
    </section>
  </div>

  <!-- 6. 문의 -->
  <section class="contact" id="contact" aria-labelledby="contact-title">
    <div class="wrap contact-grid">
      <div>
        <h2 class="sec-title" id="contact-title">어떤 공간인지 알려주세요</h2>
        <p class="sec-intro">작은 공간도 괜찮습니다. 편한 방법으로 연락 주세요.</p>
        <div class="cta" id="contact-cta"></div>
      </div>
      <form class="form" id="form" novalidate>
        <h3>문의 남기기</h3>
        <div class="field"><label for="f-name">이름</label><input type="text" id="f-name" autocomplete="name"></div>
        <div class="field"><label for="f-phone">연락처</label><input type="tel" id="f-phone" autocomplete="tel" inputmode="tel" placeholder="010-0000-0000"></div>
        <fieldset class="field"><legend>공간 종류</legend><div class="chips" id="chips"></div></fieldset>
        <div class="field"><label for="f-size">공간 크기 (평수)</label><input type="text" id="f-size" placeholder="예: 카페 40평, 거실 한쪽 벽"></div>
        <div class="field"><label for="f-body">내용</label><textarea id="f-body" placeholder="원하는 분위기, 일정, 예산 등을 편하게 적어주세요."></textarea></div>
        <label class="consent"><input type="checkbox" id="f-consent"><span>문의에 답하기 위해 이름과 연락처를 수집하는 데 동의합니다.</span></label>
        <button type="submit" class="btn btn-lichen">문의 남기기</button>
        <p class="form-msg" id="form-msg" role="alert"></p>
      </form>
    </div>

    <!-- 7. 푸터 -->
    <footer class="foot">
      <div class="wrap" id="foot"></div>
    </footer>
  </section>
</main>

<dialog class="lb" id="lb" aria-label="사진 크게 보기">
  <div class="lb-inner">
    <div class="lb-stage"><img id="lb-img" alt=""></div>
    <div class="lb-foot">
      <p class="lb-cap" id="lb-cap" style="margin:0"></p>
      <div class="lb-nav">
        <button type="button" class="icon-btn" id="lb-prev" aria-label="이전 사진"><span data-icon="prev"></span></button>
        <button type="button" class="icon-btn" id="lb-next" aria-label="다음 사진"><span data-icon="next"></span></button>
      </div>
    </div>
  </div>
  <button type="button" class="icon-btn lb-close" id="lb-close" aria-label="닫기"><span data-icon="close"></span></button>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const C = CONFIG;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const ICONS = {
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h3.2l1.6 4-2 1.3a10.5 10.5 0 0 0 6.9 6.9l1.3-2 4 1.6V19a1.6 1.6 0 0 1-1.7 1.6A15.6 15.6 0 0 1 3.4 5.7 1.6 1.6 0 0 1 5 4z"/></svg>',
    dm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".6" fill="currentColor"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5c4.7 0 8.5 2.9 8.5 6.5s-3.8 6.5-8.5 6.5c-.8 0-1.6-.1-2.3-.2L5.5 19.5l1-3.4C4.6 14.9 3.5 13 3.5 11c0-3.6 3.8-6.5 8.5-6.5z"/></svg>',
    prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>',
    next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>'
  };
  const fillIcons = (root) => root.querySelectorAll('[data-icon]').forEach((n) => { n.outerHTML = ICONS[n.dataset.icon] || ''; });

  const tel = 'tel:' + C.phone.replace(/[^\d+]/g, '');
  const dm = C.instagram ? 'https://ig.me/m/' + C.instagram : '';
  const ig = C.instagram ? 'https://www.instagram.com/' + C.instagram + '/' : '';

  /* image loading: local file → (preview only) remote copy → quiet placeholder */
  function setImg(img, p, eager) {
    const frame = img.closest('.ph');
    let stage = 0;
    img.alt = p.alt || '';
    img.width = p.w * 200; img.height = p.h * 200;
    img.decoding = 'async';
    if (!eager) img.loading = 'lazy';
    if (frame) frame.dataset.label = p.title || p.caption || '';
    img.addEventListener('load', () => img.classList.add('is-loaded'));
    img.addEventListener('error', () => {
      const remote = (window.REMOTE_PREVIEW || {})[p.src];
      if (stage === 0 && remote) { stage = 1; img.crossOrigin = 'anonymous'; img.src = remote; }
      else if (stage === 1) { stage = 2; img.removeAttribute('crossorigin'); img.src = remote + '#nc'; }
      else if (frame) { frame.classList.add('is-missing'); }
    });
    img.src = (window.EMBED && window.EMBED[p.src]) || p.src;
  }

  function ctas(dark) {
    const out = [];
    out.push('<a class="btn ' + (dark ? 'btn-lichen' : 'btn-moss') + '" href="' + tel + '">' + ICONS.phone + '<span>' + esc(C.phone) + ' 전화하기</span></a>');
    if (C.kakaoUrl) out.push('<a class="btn ' + (dark ? 'btn-ghost' : 'btn-line') + '" href="' + esc(C.kakaoUrl) + '" target="_blank" rel="noopener">' + ICONS.chat + '<span>카카오톡으로 문의하기</span></a>');
    if (dm) out.push('<a class="btn ' + (dark ? 'btn-ghost' : 'btn-line') + '" href="' + dm + '" target="_blank" rel="noopener">' + ICONS.dm + '<span>인스타그램 DM 보내기</span></a>');
    return out.join('');
  }

  /* preview notice */
  if (C.previewNotice) { const nt = $('#notice'); nt.textContent = C.previewNotice; nt.hidden = false; }

  /* 1. bar */
  const bar = $('#bar');
  $('#bar-mark').textContent = C.bizName;
  $('#bar-call').href = tel;
  const onScroll = () => bar.classList.toggle('is-solid', window.scrollY > 8);
  window.addEventListener('scroll', onScroll, { passive: true }); onScroll();

  /* 2. hero */
  const h1 = $('#hero-title');
  h1.setAttribute('aria-label', C.headline);
  let k = 0;
  h1.innerHTML = Array.from(C.headline).map((ch) => ch === ' ' ? '<span class="sp" aria-hidden="true"></span>' : '<span class="ch" aria-hidden="true" style="--i:' + (k++) + '">' + esc(ch) + '</span>').join('');
  setImg($('#hero-img'), C.hero, true);
  $('#hero-cap').textContent = C.hero.caption || '';
  $('#hero-name').textContent = C.bizName;
  $('#hero-lede').textContent = C.tagline;
  const cred = $('#hero-cred'); cred.textContent = C.credential || ''; cred.hidden = !C.credential;
  $('#hero-cta').innerHTML = ctas(false);

  /* 3. gallery */
  const intro = $('#archive-intro'); intro.textContent = C.galleryIntro || ''; intro.hidden = !C.galleryIntro;
  const gal = $('#gallery');
  C.photos.forEach((p, i) => {
    const fig = document.createElement('figure');
    fig.innerHTML = '<button type="button" class="ph" aria-label="' + esc(p.title) + ' 사진 크게 보기"><img></button>' +
      '<figcaption><span class="t">' + esc(p.title) + '</span><span class="n">' + esc([p.note, p.year].filter(Boolean).join(', ')) + '</span></figcaption>';
    gal.appendChild(fig);
    setImg(fig.querySelector('img'), p, false);
    fig.querySelector('button').addEventListener('click', () => openLB(i));
  });
  const q = $('#quote'); q.querySelector('p').textContent = C.quote || ''; q.hidden = !C.quote;

  /* 4. reviews (verbatim only) / credits */
  if (C.reviews && C.reviews.length) {
    $('#review-list').innerHTML = C.reviews.map((r) => '<li><blockquote>' + esc(r.body) + '</blockquote><footer>' + esc([r.author, r.date].filter(Boolean).join(', ')) + '</footer></li>').join('');
    $('#reviews').hidden = false;
  }
  if (C.credits && C.credits.length) {
    $('#credit-list').innerHTML = C.credits.map((c) => '<li><span class="c">' + esc(c.client) + '</span><span class="p">' + esc(c.project) + '</span><span class="y">' + esc(c.year) + '</span></li>').join('');
  } else { $('#credits').hidden = true; }

  /* 5. services */
  $('#svc-list').innerHTML = C.services.map((s) => '<li><h3>' + esc(s.name) + '</h3><p>' + esc(s.desc) + '</p></li>').join('');
  $('#steps').innerHTML = C.process.map((s, i) => '<li><span class="num" aria-hidden="true">' + (i + 1) + '</span><div><h3>' + esc(s.name) + '</h3><p>' + esc(s.desc) + '</p></div></li>').join('');
  const area = $('#area'); area.textContent = C.areaNote || ''; area.hidden = !C.areaNote;

  /* 6. contact */
  $('#contact-cta').innerHTML = ctas(true);
  $('#chips').innerHTML = C.spaceTypes.map((t, i) => '<label><input type="radio" name="space" value="' + esc(t) + '"><span>' + esc(t) + '</span></label>').join('');
  const form = $('#form'), msg = $('#form-msg');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let err = '';
    if (!$('#f-name').value.trim()) err = '이름을 입력해 주세요.';
    else if (!/\d{2,}/.test($('#f-phone').value)) err = '연락처를 입력해 주세요.';
    else if (!$('#f-consent').checked) err = '개인정보 수집에 동의해 주세요.';
    msg.textContent = err;
    if (err) return;
    toast('시안 화면이라 실제로 전송되지는 않습니다. 정식 오픈 후에는 이 문의가 사장님 휴대폰 문자로 바로 갑니다.');
    form.reset();
  });

  /* 7. footer */
  const lines = [];
  lines.push('<a class="mark" href="#top">' + esc(C.bizName) + '</a>');
  lines.push('<p>실내조경, 플랜테리어, 이끼정원</p>');
  lines.push('<p>전화 <a href="' + tel + '">' + esc(C.phone) + '</a></p>');
  if (ig) lines.push('<p>인스타그램 <a href="' + ig + '" target="_blank" rel="noopener">@' + esc(C.instagram) + '</a></p>');
  if (C.area) lines.push('<p>작업 지역 ' + esc(C.area) + '</p>');
  if (C.address) lines.push('<p>' + esc(C.address) + '</p>');
  if (C.bizInfo && (C.bizInfo.owner || C.bizInfo.regNo)) lines.push('<p>' + esc([C.bizInfo.owner && '대표 ' + C.bizInfo.owner, C.bizInfo.regNo && '사업자등록번호 ' + C.bizInfo.regNo].filter(Boolean).join(', ')) + '</p>');
  lines.push('<p class="note">이 페이지는 ' + esc(C.bizName) + '에 보여드리기 위해 만든 시안입니다.</p>');
  $('#foot').innerHTML = lines.join('');

  /* toast */
  const toastEl = $('#toast'); let tt;
  function toast(text) { toastEl.textContent = text; toastEl.classList.add('is-on'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('is-on'), 5200); }

  /* lightbox */
  const lb = $('#lb'), lbImg = $('#lb-img'), lbCap = $('#lb-cap');
  const thumbs = () => gal.querySelectorAll('img');
  let cur = 0;
  function show() {
    const p = C.photos[cur], t = thumbs()[cur];
    lbImg.src = t.currentSrc || t.src; lbImg.alt = p.alt || '';
    lbCap.innerHTML = '<span class="t">' + esc(p.title) + '</span><span class="n">' + esc([p.note, p.year].filter(Boolean).join(', ')) + '</span>';
  }
  function openLB(i) { cur = i; show(); if (lb.showModal) lb.showModal(); else lb.setAttribute('open', ''); }
  const step = (d) => { cur = (cur + d + C.photos.length) % C.photos.length; show(); };
  $('#lb-prev').addEventListener('click', () => step(-1));
  $('#lb-next').addEventListener('click', () => step(1));
  $('#lb-close').addEventListener('click', () => lb.close());
  lb.addEventListener('click', (e) => { if (e.target === lb || e.target.classList.contains('lb-stage')) lb.close(); });
  lb.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
  let sx = null;
  lb.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', (e) => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); sx = null; });

  fillIcons(document);
})();
</script>

<script>
/* ---------------------------------------------------------------------
   REMOTE_PREVIEW — 미리보기 전용 임시 이미지 (인스타 CDN, 640px)
   · img/ 폴더에 원본이 없을 때만 사용됩니다.
   · 서명 URL이라 2026-10-08(목) 전후로 만료됩니다.
   · 발송·배포 전: 원본을 img/00.jpg ~ img/10.jpg 로 저장하고 이 블록 삭제.
   --------------------------------------------------------------------- */
window.REMOTE_PREVIEW = {
