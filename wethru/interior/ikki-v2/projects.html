<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Projects | ikki archive</title><meta name="description" content="ikki archive의 주거, 상업, 전시 프로젝트를 분야별로 확인하세요."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;400&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="site-pages.css"></head><body><header class="site-head"><a class="brand logo-brand" href="index.html" aria-label="ikki archive home"><img src="ikki-logo.svg" alt="ikki"></a><nav class="main-nav"><a href="projects.html">PROJECTS</a><a href="about.html">ABOUT</a><a href="process.html">PROCESS</a><a href="index.html#contact">CONTACT</a></nav><a class="call" href="tel:01094816769">전화 상담</a></header><section class="hero-sub"><p class="kicker">Selected works</p><h1>Projects</h1><p class="lead">주거공간, 상업공간, 전시 프로젝트를 분야별로 모았습니다. 각 프로젝트를 누르면 위치와 지도 링크, 원문 게시물까지 확인할 수 있습니다.</p></section><main class="page"><div class="filters"><button class="on" data-filter="all">전체</button><button data-filter="residential">주거공간</button><button data-filter="commercial">상업공간</button><button data-filter="exhibition">전시·팝업</button></div><div class="grid" id="project-grid"></div></main><footer class="foot"><span>ikki archive · Busan / Gyeongnam / Ulsan</span><a href="https://www.instagram.com/ikki_archive/" target="_blank" rel="noopener">@ikki_archive</a></footer><script src="site-data.js"></script><script>
const grid=document.querySelector('#project-grid');const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function draw(f='all'){const items=window.IKKI_PROJECTS.filter(p=>f==='all'||p.category===f);grid.innerHTML=items.map(p=>`<article class="card"><a class="img" href="project.html?id=${encodeURIComponent(p.id)}"><img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy"></a><div class="meta"><span>${esc(p.categoryKo)} · ${esc(p.year)}</span><span>${esc(p.location)}</span></div><h2><a href="project.html?id=${encodeURIComponent(p.id)}">${esc(p.title)}</a></h2><p>${esc(p.summary)}</p></article>`).join('');}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('on'));b.classList.add('on');draw(b.dataset.filter)}));draw();
</script></body></html>
